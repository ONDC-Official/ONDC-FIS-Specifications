summary: Purchase Finance - Pre-Part Payment(Solar)
details:
  - description: Detailed process for Pre-Part Payment
    mermaid: |-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Borrower Platform (BAP)->>Lender Platform (BPP): update-Request
        Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update success
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The provider platform provides the unsolicited on_update call
    api: on_update
    details:
      - description: The provider platform provides the unsolicited on_update call.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
    reference: if any
    example:
      value:
        $ref: >-
          ../../examples/purchase-finance/on_update/unsolicited_on_update.yaml
   

  - summary: The borrower (BAP) sends the update request by sending the order ID.
    api: update
    details:
      - description: >-
          The borrower (BAP) sends the update request by sending the order ID to
          be updated along with the object in the order to be updated as
          update_target.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/purchase-finance/update/update_request_pre_part_payment.yaml
  - summary: The provider platform updates the consumer.
    api: on_update
    details:
      - description: >-
          The provider platform updates the consumer with on_update request
          response.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update success
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: >-
          ../../examples/purchase-finance/on_update/on_update_request_pre_part_payment.yaml
  - summary: The provider platform updates the consumer with pre part payment success.
    api: on_update
    details:
      - description: >-
          The provider platform updates the consumer with pre part payment success.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update success
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: >-
          ../../examples/purchase-finance/on_update/on_update_request_pre_part_payment_completed.yaml
