summary: Payment Failure
references: if any
steps:

  - summary: Insurer confirms the motor insurance order
    api: on_confirm
    details:
      - description: Insurer confirms the motor insurace and provides the confirmation details.
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
            end
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/motor-insurance/on_confirm/on_confirm-request.yaml"  
  - summary: Payment link shared with the buyer app.
    api: form
    details:
      - description: Buyer app redirected to external link for payment collection.
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
            end
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
    reference: if any
    example:
      value: 
        $ref: "../../examples/motor-insurance/form/manual-review.html"

  - summary: Provider platform sends unsolicated update.
    api: on_update
    details:
      - description: The insurer initiates an unsolicited on_update API call to notify the updated payment status
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/motor-insurance/on_update/on_update_payment_failure_1.yaml"  
  - summary: Buyer app request for new payment link
    api: update
    details:
      - description: Buyer app request for new payment link
        mermaid: >-
         sequenceDiagram
            title  Order Confirmation
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Insurer Platform (BPP): update
            Insurer Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK 
    reference: if any
    example:
      value:
        $ref: "../../examples/motor-insurance/update/update_request_payment_failure.yaml"         
  - summary: Insurer responds to the update request & provides the new payment link
    api: on_update
    details:
      - description: Insurer responds to the update request & provides the new payment link
        mermaid: >-
         sequenceDiagram
            title  Order Confirmation
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            Buyer Platform (BAP)->>Insurer Platform (BPP): update
            Insurer Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK 
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/motor-insurance/on_update/on_update_payment_failure_2.yaml"  


  
  
  
