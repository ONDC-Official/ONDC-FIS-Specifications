summary: Unified flow for Credit use-cases
details:
  - description: Discovery of Funds
    mermaid: >-
      sequenceDiagram
        title Personal Loan Discovery
        Borrower Platform (BAP)->>Gateway (BG): search
        Gateway (BG) ->> Borrower Platform (BAP): ACK
        Gateway (BG)->>Registry: Lookup Lender Platforms (lookup)
        Registry->>Gateway (BG): List of Lender Platforms (200 OK)
        Gateway (BG)->>Lender Platform(BPP): search
        Lender Platform(BPP)->>Gateway (BG) : ACK
        Lender Platform(BPP)->>Borrower Platform (BAP): Publish Catalog of Lender 1 (on_search)
        Borrower Platform (BAP)->>Lender Platform(BPP): ACK

references: if any
steps:
  - summary: The borrower searches for the available loan services
    api: search
    details:
      - description: The borrower searches for the available loan services on the network
        mermaid: >-
          sequenceDiagram
            title Personal Loan Discovery
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Gateway (BG): search
            Gateway (BG) ->> Borrower Platform (BAP): ACK
            Gateway (BG)->>Registry: Lookup Lender Platforms (lookup)
            Registry->>Gateway (BG): List of Lender Platforms (200 OK)
            Gateway (BG)->>Lender Platform(BPP): search
            Lender Platform(BPP)->>Gateway (BG) : ACK
            end
            Lender Platform(BPP)->>Borrower Platform (BAP): Publish Catalog of Lender 1 (on_search)
            Borrower Platform (BAP)->>Lender Platform(BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/search/search-request-common.yaml"
  - summary: The lender provides a catalog of loan types such as personal loans, GST-based loans, purchase finance, and working capital etc.
    api: on_search
    details:
      - description: The lender provides a catalog of loan types such as personal loans, GST-based loans, purchase finance, and working capital etc.
        mermaid: >-
          sequenceDiagram
            title Personal Loan Discovery
            Borrower Platform (BAP)->>Gateway (BG): search
            Gateway (BG) ->> Borrower Platform (BAP): ACK
            Gateway (BG)->>Registry: Lookup Lender Platforms (lookup)
            Registry->>Gateway (BG): List of Lender Platforms (200 OK)
            Gateway (BG)->>Lender Platform(BPP): search
            Lender Platform(BPP)->>Gateway (BG) : ACK
            rect rgb(191, 223, 255)
            Lender Platform(BPP)->>Borrower Platform (BAP): Publish Catalog of Lender 1 (on_search)
            Borrower Platform (BAP)->>Lender Platform(BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_search/on_search_request_common.yaml"
