summary: Discovery of Insurer Providers & Master Policies
description: BAP buys Insurance cover to allocate from already purchased sachet with BPP.
details:
  - description: Discovery of Insurance Providers .
    mermaid: >-
      sequenceDiagram
        title insurance Discovery
        Buyer Platform (BAP)->>Gateway (BG): search
        Gateway (BG) ->> Buyer Platform (BAP): ACK
        Gateway (BG)->>Registry: Lookup Insurer Platforms (lookup)
        Registry->>Gateway (BG): List of Insurer Platforms (200 OK)
        Gateway (BG)->>Insurer Platform (BPP): search
        Insurer Platform (BPP)->>Gateway (BG) : ACK
        Insurer Platform (BPP)->>Buyer Platform (BAP): Publish Catalog of Insurer 1 (on_search)
        Buyer Platform (BAP)->>Insurer Platform (BPP): ACK
references: if any
steps:
  - summary: Buyer app search for available Insurance providers
    api: search
    details:
      - description: Buyer app explore Insurance options by searching for insurers over the network.
        mermaid: >-
          sequenceDiagram
            title Insurance Discovery
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Gateway (BG): search
            Gateway (BG) ->> Buyer Platform (BAP): ACK
            Gateway (BG)->>Registry: Lookup Insurer Platforms (lookup)
            Registry->>Gateway (BG): List of Insurer Platforms (200 OK)
            Gateway (BG)->>Insurer Platform (BPP): search
            Insurer Platform (BPP)->>Gateway (BG) : ACK
            end
            Insurer Platform (BPP)->>Buyer Platform (BAP): Publish Catalog of Insurer 1 (on_search)
            Buyer Platform (BAP)->>Insurer Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/hospicash-insurance/search/search_request_1.yaml"
  - summary: Insurer provides a catalog of insurance products
    api: on_search
    details:
      - description: Insurer sends a comprehensive catalog of various insurance products specifically tailored for Insurance.
        mermaid: >-
          sequenceDiagram
            title Insurance Discovery
            Buyer Platform (BAP)->>Gateway (BG): search
            Gateway (BG) ->> Buyer Platform (BAP): ACK
            Gateway (BG)->>Registry: Lookup Insurer Platforms (lookup)
            Registry->>Gateway (BG): List of Insurer Platforms (200 OK)
            Gateway (BG)->>Insurer Platform (BPP): search
            Insurer Platform (BPP)->>Gateway (BG) : ACK
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP): Publish Catalog of Insurer 1 (on_search)
            Buyer Platform (BAP)->>Insurer Platform (BPP): ACK  
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/hospicash-insurance/on_search/on_search_request_1.yaml"
  