summary: Discovery of Products from Master Policies(Hospicash Insurance)
description: BAP buys Insurance cover to allocate from already purchased sachet with BPP.
details:
  - description: Discovery of Products .
    mermaid: >-
      sequenceDiagram
        title  Order Confirmation
        participant Buyer Platform (BAP)
        participant Insurer Platform (BPP)
        Buyer Platform (BAP)->>Insurer Platform (BPP): search
        Insurer Platform (BPP)-->>Buyer Platform (BAP):ACK
        Insurer Platform (BPP)->>Buyer Platform (BAP):on_search
        Buyer Platform (BAP)-->>Insurer Platform (BPP): ACK 
references: if any
steps:
  - summary: Buyer app select the master policy
    api: search
    details:
      - description: Buyer app select the master policy
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Insurer Platform (BPP): search
            Insurer Platform (BPP)->>Buyer Platform (BAP): ACK
            end
            Insurer Platform (BPP)->>Buyer Platform (BAP): on_search
            Buyer Platform (BAP)->> Insurer Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/hospicash-insurance/search/search_request_2.yaml"
  - summary: Insurer provides a catalog for a specific master policy
    api: on_search
    details:
      - description: Insurer provides a catalog for a specific master policy deatils
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Buyer Platform (BAP)
            participant Insurer Platform (BPP)

            Buyer Platform (BAP)->>Insurer Platform (BPP): search
            Insurer Platform (BPP)->>Buyer Platform (BAP): ACK
            rect rgb(191, 223, 255)
            Insurer Platform (BPP)->>Buyer Platform (BAP): on_search
            Buyer Platform (BAP)->> Insurer Platform (BPP): ACK
            end
           
    reference: if any
    example:
      value:
        $ref: "../../examples/hospicash-insurance/on_search/on_search_request_2.yaml"
  