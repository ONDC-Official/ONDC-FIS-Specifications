summary: Business Loan - Term Loan Pre-Part Payment
details:
  - description: >-
      The borrower pays the first scheduled INR 82415.92 installment in advance. The illustrative
      settlement includes its contractual principal and interest; after verified payment the
      original installment is DEFERRED. The remaining installments stay unchanged.
    mermaid: |-
      sequenceDiagram
        participant BAP as Borrower Platform BAP
        participant BPP as Lender Platform BPP
        BPP->>BAP: on_confirm original disbursed term-loan order
        BAP-->>BPP: ACK
        Note over BAP,BPP: Original loan confirmation precedes servicing
        BAP->>BPP: update payment intent
        BPP-->>BAP: ACK
        BPP->>BAP: on_update payable quote and payment URL
        BAP-->>BPP: ACK
        Note over BAP,BPP: Payment outside the protocol and lender verification
        BPP->>BAP: on_update verified payment result
        BAP-->>BPP: ACK
steps:
  - summary: The lender confirms the term loan order.
    api: on_confirm
    details:
      - description: >-
          The original confirmation is the existing bureau-only single-redirection flow, included as
          historical context. Each servicing flow is an independent illustration.
    example:
      value:
        $ref: ../../examples/term-loan/on_confirm/on_confirm_request_bureau_single_redirection.yaml
  - summary: The borrower requests term loan pre-part payment.
    api: update
    details:
      - description: >-
          Use update_target payments and the original loan order ID. The three examples are
          independent alternatives on an existing loan, not additional origination steps.
    example:
      value:
        $ref: ../../examples/term-loan/update/update_request_pre_part_payment.yaml
  - summary: The lender quotes the term loan pre-part payment.
    api: on_update
    details:
      - description: >-
          The solicited callback retains the request message ID and original loan attributes. The
          selected servicing payment amount is the amount to collect. The order quote represents the
          total loan cost and is not another payment. Charges and calculations are illustrative.
    example:
      value:
        $ref: ../../examples/term-loan/on_update/on_update_pre_part_payment_quote.yaml
  - summary: The lender confirms verified term loan pre-part payment.
    api: on_update
    details:
      - description: >-
          The unsolicited callback uses a fresh message ID and retains the transaction, order and
          settlement payment IDs. Mark PAID only after authoritative lender verification.
    example:
      value:
        $ref: ../../examples/term-loan/on_update/on_update_pre_part_payment_success.yaml
