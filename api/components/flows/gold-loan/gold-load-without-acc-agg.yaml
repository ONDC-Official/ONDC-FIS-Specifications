  - summary: The lender sends available loan offers for the chosen Gold Loan service.
    api: on_select
    details:
      - description: The lender platform responds with detailed information and the necessary application form for the selected Gold Loan service.
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            Borrower Platform (BAP)->>Lender Form Service: Get Form(Org Form)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            Borrower Platform (BAP)->>Lender Platform (BPP): select(with submissionID)
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/gold-loan/on_select/on_select_request_6.yaml" 
  - summary: The lender invoked the relevant forms like links for KYC, bank details, e-mandate etc.
    api: form
    details:
      - description: The lender platform sends the form to collect Know Your Customer (KYC) details from the borrower.
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value: 
        $ref: ../../examples/personal-loans/forms/personal-loans-kyc.html                        
  - summary: The lender sends the form status
    api: on_status
    details:
      - description: The lender sends the form status
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value: 
        $ref: ../../examples/gold-loan/on_status/on_status_request_pending_2.yaml
  
  - summary: The borrower request for order status
    api: status
    details:
      - description: The borrower request for order status
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): status
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value: 
        $ref: ../../examples/gold-loan/status/status-request_1.yaml
  - summary: The lender sends the latest order status of the form
    api: on_status
    details:
      - description: The lender sends the latest order status of the form
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Borrower Platform (BAP)->>Lender Platform (BPP): status
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value: 
        $ref: ../../examples/gold-loan/on_status/on_status_request_completed_3.yaml                                           
  
  
  - summary: The borrower initiates the Gold Loan request by filling the form.
    api: init
    details:
      - description: The borrower platform initiates the Gold Loan request by filling the form such as KYC detals, bank details and e-madate.
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): init(with submissionID)
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_init
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example: 
      value:
        $ref: "../../examples/gold-loan/init/init-request_2.yaml"
  - summary: The lender accepts the Gold Loan request and displays loan status details and requests for loan dispach account details.
    api: on_init
    details:
      - description: The lender platform accepts the borrower's request terms and and displays loan status details amd may include additional terms if any.
        mermaid: >-
          sequenceDiagram
            title Initializing Order
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            Borrower Platform (BAP)->>Lender Platform (BPP): init(with submissionID)
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_init
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/gold-loan/on_init/on_init_request_2.yaml" 
 
  - summary: The borrower confirms the Gold Loan request.
    api: confirm
    details:
      - description: The borrower platform confirms the Gold Loan request by signing the agreement and provides all the necessary information as per the terms.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
        
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): confirm
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/gold-loan/confirm/confirm-request_2.yaml"         
  - summary: The lender confirms the Gold Loan order.
    api: on_confirm
    details:
      - description: The lender platform confirms the Gold Loan order and provides the final confirmation details.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Borrower Platform (BAP)->>Lender Platform (BPP): confirm
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/gold-loan/on_confirm/on_confirm_request_2.yaml"
        