summary: Personal Loan - Single Redirection
details:
  - description: The lender sends the offer and the link to its own journey in the same on_select. The borrower finishes KYC, bank account verification, e-mandate and the loan agreement on the lender's pages, and the lender sends an unsolicited on_status after each step. No init / on_init and no BAP confirm.
    mermaid: |-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): search
        Lender Platform (BPP)->>Borrower Platform (BAP): on_search
        Borrower Platform (BAP)->>Lender Platform (BPP): select (dedupe)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_select (dedupe accepted)
        Borrower Platform (BAP)->>Lender Platform (BPP): select (personal details)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_select (offer and journey link)
        Borrower Platform (BAP)->>Lender Form Service: form
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
        Borrower Platform (BAP)->>Lender Platform (BPP): select
        Lender Platform (BPP)->>Borrower Platform (BAP): on_select
references: if any
steps:
  - summary: The borrower searches for personal loans on the network.
    api: search
    details:
      - description: The borrower searches for personal loans on the network.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/search/search-request-common.yaml
  - summary: The lender publishes its Personal Loan catalog, with the personal details form (PERSONAL_INFORMATION, mime_type none) on each loan item.
    api: on_search
    details:
      - description: The lender publishes its Personal Loan catalog, with the personal details form (PERSONAL_INFORMATION, mime_type none) on each loan item.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_search/on_search_request_common.yaml
  - summary: Before asking for an offer, the borrower app runs the dedupe check with the lender (select on the Pre Qualifier item, fulfillment type DEDUPE, with the borrower's PAN, date of birth and phone).
    api: select
    details:
      - description: Before asking for an offer, the borrower app runs the dedupe check with the lender (select on the Pre Qualifier item, fulfillment type DEDUPE, with the borrower's PAN, date of birth and phone).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/select/select_request_dedupe.yaml
  - summary: The lender accepts the lead (fulfillment state ACCEPTED). If it rejects the lead, the journey stops here (see Personal Loan - Dedupe Check (Rejected)).
    api: on_select
    details:
      - description: The lender accepts the lead (fulfillment state ACCEPTED). If it rejects the lead, the journey stops here (see Personal Loan - Dedupe Check (Rejected)).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_select/on_select_request_dedupe_accepted.yaml
  - summary: The borrower app shows the lender's personal details form on its own screen and sends the values in select to ask for an offer.
    api: select
    details:
      - description: The borrower app shows the lender's personal details form on its own screen and sends the values in select to ask for an offer.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/select/select_request_personal_information_sr.yaml
  - summary: The lender sends the offer and, in the same reply, the link to its own journey (SINGLE_REDIRECTION xinput, mime_type application/html). There is no second select to pick an offer.
    api: on_select
    details:
      - description: The lender sends the offer and, in the same reply, the link to its own journey (SINGLE_REDIRECTION xinput, mime_type application/html). There is no second select to pick an offer.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_select/on_select_request_offer_sr.yaml
  - summary: The borrower accepts the offer and completes KYC, bank account verification, repayment set-up and the loan agreement on the lender's pages.
    api: form
    details:
      - description: The borrower accepts the offer and completes KYC, bank account verification, repayment set-up and the loan agreement on the lender's pages.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Form Service
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Form Service: Open the lender's journey page
            Lender Form Service-->>Borrower Platform (BAP): Borrower completes the steps on the lender's pages
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/forms/personal-loans-single-redirection.html
  - summary: 'Unsolicited on_status after the step: offer accepted, kyc completed.'
    api: on_status
    details:
      - description: 'Unsolicited on_status after the step: offer accepted, kyc completed.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_status/on_status_request_sr_kyc.yaml
  - summary: 'Unsolicited on_status after the step: bank account verified.'
    api: on_status
    details:
      - description: 'Unsolicited on_status after the step: bank account verified.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
