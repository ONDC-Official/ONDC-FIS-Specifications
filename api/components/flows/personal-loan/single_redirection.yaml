        $ref: ../../examples/personal-loans/on_status/on_status_request_sr_agreement.yaml
  - summary: 'Optional: the borrower app sends the submission_id of the lender''s journey form.'
    api: select
    details:
      - description: 'Optional: the borrower app sends the submission_id of the lender''s journey form.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
