        $ref: ../../examples/personal-loans/on_status/on_status_request_sr_bank_account.yaml
  - summary: 'Unsolicited on_status after the step: repayment set up.'
    api: on_status
    details:
      - description: 'Unsolicited on_status after the step: repayment set up.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_status/on_status_request_sr_repayment.yaml
  - summary: 'Unsolicited on_status after the step: loan agreement signed.'
    api: on_status
    details:
      - description: 'Unsolicited on_status after the step: loan agreement signed.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
