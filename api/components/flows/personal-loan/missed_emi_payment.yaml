summary: Personal Loan - Missed-EMI Payment
details:
  - description: The borrower asks for a missed-emi payment with update (payment label MISSED_EMI_PAYMENT). The lender returns a quote and a payment link in on_update, then an on_update with the payment PAID. The missed instalment is DELAYED and the quote adds the late fee (LATE_FEE_AMOUNT); once paid, the instalment is DEFERRED.
    mermaid: |-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
        Borrower Platform (BAP)->>Lender Platform (BPP): update
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update
references: if any
steps:
  - summary: The lender confirms the order when the loan is disbursed (unsolicited on_confirm).
    api: on_confirm
    details:
      - description: The lender confirms the order when the loan is disbursed (unsolicited on_confirm).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_confirm/on_confirm_request_disbursed_sr.yaml
  - summary: The borrower app sends the missed-emi payment request with the order ID (payment label MISSED_EMI_PAYMENT).
    api: update
    details:
      - description: The borrower app sends the missed-emi payment request with the order ID (payment label MISSED_EMI_PAYMENT).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/update/update_request_missed_emi_payment.yaml
  - summary: The lender returns the quote and the payment link.
    api: on_update
    details:
      - description: The lender returns the quote and the payment link.
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_update/on_update_request_missed_emi_payment_quote.yaml
  - summary: The lender confirms the payment (PAID).
    api: on_update
    details:
      - description: The lender confirms the payment (PAID).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_update/on_update_request_missed_emi_payment_paid.yaml
