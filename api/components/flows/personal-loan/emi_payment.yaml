summary: Personal Loan - EMI Payment Updates
details:
  - description: After disbursal the lender sends an unsolicited on_status every time an EMI is paid. As in PL 2.0.3, on_status after on_confirm carries only state changes (the instalment status moves to PAID); new fields go in on_update.
    mermaid: |-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status
references: if any
steps:
  - summary: The lender confirms the order when the loan is disbursed (unsolicited on_confirm).
    api: on_confirm
    details:
      - description: The lender confirms the order when the loan is disbursed (unsolicited on_confirm).
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_confirm/on_confirm_request_disbursed_sr.yaml
  - summary: 'EMI 1 is paid: unsolicited on_status with instalment 1 PAID.'
    api: on_status
    details:
      - description: 'EMI 1 is paid: unsolicited on_status with instalment 1 PAID.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_status/on_status_request_emi_1_paid.yaml
  - summary: 'EMI 2 is paid: unsolicited on_status with instalment 2 PAID.'
    api: on_status
    details:
      - description: 'EMI 2 is paid: unsolicited on_status with instalment 2 PAID.'
        mermaid: |-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: ../../examples/personal-loans/on_status/on_status_request_emi_2_paid.yaml
