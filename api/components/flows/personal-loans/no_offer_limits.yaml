summary: Personal Loan - No Offer (Limits)
details:
  - description: The borrower submits the personal information form in select. The lender returns no offer and sends error code 80227 (Limits).
    mermaid: >-
      sequenceDiagram
        title Personal Loan No Offer
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): select
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_select (error 80227)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
