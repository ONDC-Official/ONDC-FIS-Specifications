summary: Personal Loan - EMI Payment Updates
details:
  - description: After disbursal, the lender sends an unsolicited on_status every time an EMI is paid. Each on_status carries only the state change, so the paid instalment moves from NOT-PAID to PAID.
    mermaid: >-
      sequenceDiagram
        title Personal Loan EMI Payment Updates
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 1 PAID)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 2 PAID)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The lender confirms the personal loan order once the amount is disbursed.
    api: on_confirm
    details:
      - description: The lender confirms the personal loan order once the amount is disbursed.
        mermaid: >-
          sequenceDiagram
            title Personal Loan EMI Payment Updates
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 1 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 2 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_confirm/on_confirm_request_disbursed.yaml"
  - summary: The lender sends an unsolicited on_status once the first EMI is paid.
    api: on_status
    details:
      - description: The lender sends an unsolicited on_status once the first EMI is paid.
        mermaid: >-
          sequenceDiagram
            title Personal Loan EMI Payment Updates
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 1 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 2 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_status/on_status_request_emi_paid_1.yaml"
  - summary: The lender sends an unsolicited on_status once the second EMI is paid.
    api: on_status
    details:
      - description: The lender sends an unsolicited on_status once the second EMI is paid.
        mermaid: >-
          sequenceDiagram
            title Personal Loan EMI Payment Updates
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 1 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_status (EMI 2 PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_status/on_status_request_emi_paid_2.yaml"
