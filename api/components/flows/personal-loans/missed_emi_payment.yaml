            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Borrower Platform (BAP)->>Lender Platform (BPP): update (MISSED_EMI_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
