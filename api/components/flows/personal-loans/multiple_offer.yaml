  - summary: The borrower shares the personal loan details.
    api: search
    details:
      - description: The borrower shares the personal loan details.
        mermaid: >-
          sequenceDiagram
            title  Personal Loan Discovery
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/search/search-request-wihtout_AA_1.yaml"

  - summary: The lender sends the updated Checklist with the Loan Offer details.
    api: on_search
    details:
      - description: The lender sends the updated Checklist
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_search/on_search_request_without_AA.yaml"
  
  
  - summary: The borrower shares the personal loan details.
    api: search
    details:
      - description: The borrower shares the personal loan details.
        mermaid: >-
          sequenceDiagram
            title  Personal Loan Discovery
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
         
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
