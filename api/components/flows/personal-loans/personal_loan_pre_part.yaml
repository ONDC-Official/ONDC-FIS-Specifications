summary: Personal Loan - Part Payment
details:
  - description: The borrower asks to make a part payment with payment label PRE_PART_PAYMENT. The lender replies with a quote and a payment link, then sends an unsolicited on_update once the payment is PAID; the EMI it covers is DEFERRED.
    mermaid: >-
      sequenceDiagram
        title Personal Loan Part Payment
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Borrower Platform (BAP)->>Lender Platform (BPP): update (PRE_PART_PAYMENT)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The lender confirms the personal loan order once the amount is disbursed.
    api: on_confirm
    details:
      - description: The lender confirms the personal loan order once the amount is disbursed.
        mermaid: >-
          sequenceDiagram
            title Personal Loan Part Payment
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Borrower Platform (BAP)->>Lender Platform (BPP): update (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_confirm/on_confirm_request_disbursed.yaml"
  - summary: The borrower asks to make a part payment by sending the order ID with update_target payments and label PRE_PART_PAYMENT.
    api: update
    details:
      - description: The borrower asks to make a part payment by sending the order ID with update_target payments and label PRE_PART_PAYMENT.
        mermaid: >-
          sequenceDiagram
            title Personal Loan Part Payment
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/update/update_request_pre_part_payment.yaml"
  - summary: The lender sends the quote and a payment link for the PRE_PART_PAYMENT payment.
    api: on_update
    details:
      - description: The lender sends the quote and a payment link for the PRE_PART_PAYMENT payment.
        mermaid: >-
          sequenceDiagram
            title Personal Loan Part Payment
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Borrower Platform (BAP)->>Lender Platform (BPP): update (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_update/on_update_request_pre_part_payment_quote.yaml"
  - summary: The lender confirms the PRE_PART_PAYMENT payment is PAID; the EMI it covers is DEFERRED.
    api: on_update
    details:
      - description: The lender confirms the PRE_PART_PAYMENT payment is PAID; the EMI it covers is DEFERRED.
        mermaid: >-
          sequenceDiagram
            title Personal Loan Part Payment
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm (DISBURSED)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Borrower Platform (BAP)->>Lender Platform (BPP): update (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (quote)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update (PAID)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/personal-loans/on_update/on_update_request_pre_part_payment_success.yaml"
