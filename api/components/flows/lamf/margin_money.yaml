summary: LAMF - Margin Money
details:
- description: Unsolicited margin-shortfall lifecycle notifications for an active LAMF credit line.
  mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_RAISED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_RESOLVED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_EXPIRED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK"
references: if any
steps:
- summary: The lender raises a margin shortfall.
  api: on_update
  details:
  - description: The lender posts MARGIN_SHORTFALL_RAISED with shortfall amount, due date, LTV percent, and payment link.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_RAISED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_lamf_margin_money.yaml
- summary: The lender marks the margin shortfall resolved.
  api: on_update
  details:
  - description: The lender posts MARGIN_SHORTFALL_RESOLVED once the shortfall payment is received or the margin call is otherwise resolved.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_RESOLVED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_lamf_margin_money_resolved.yaml
- summary: The lender marks the margin shortfall expired.
  api: on_update
  details:
  - description: The lender posts MARGIN_SHORTFALL_EXPIRED when the margin call due date lapses without resolution.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - MARGIN_SHORTFALL_EXPIRED\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_lamf_margin_money_expired.yaml
