summary: LAMF - Drawdown
details:
- description: Detailed process for drawing down from an active LAMF credit line.
  mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (DRAW_DOWN)\n  Lender Platform (BPP)-->>Borrower Platform (BAP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Drawdown completed or rejected\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK"
references: if any
steps:
- summary: The borrower requests a drawdown from the active LAMF credit line.
  api: update
  details:
  - description: The borrower sends an update request with the requested drawdown amount.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (DRAW_DOWN)\n  Lender Platform (BPP)-->>Borrower Platform (BAP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/update/update_request_lamf_drawdown.yaml
- summary: The lender confirms drawdown completion.
  api: on_update
  details:
  - description: The lender confirms the amount approved and credited to the registered account.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Drawdown completed\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_lamf_drawdown_success.yaml
- summary: The lender rejects the drawdown request.
  api: on_update
  details:
  - description: The lender rejects the drawdown request using the requested payment object with rejection details in tags.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Drawdown rejected\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_lamf_drawdown_rejected.yaml
