- summary: The lender sends the completion of disbursal through unsolicited on_update call
  api: on_update
  # stepName: Child Order
  details:
  - description: The lender sends the completion of disbursal through unsolicited on_update call
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        rect rgb(191, 223, 255)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Child Order
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        end
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Base Order
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_update/on_update_request_drawdown.yaml
