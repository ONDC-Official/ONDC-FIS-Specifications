summary: LAMF - Drawdown
details:
- description: Detailed process for drawing down from an active LAMF credit line, including approved terms and borrower consent before child-order disbursement.
  mermaid: >-
    sequenceDiagram
      participant Borrower Platform (BAP)
      participant Lender Platform (BPP)
      Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (DRAW_DOWN on Base Order)
      Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
      Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Approved drawdown terms and consent required
      Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
      Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (Borrower consent submitted)
      Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
      alt Drawdown approved
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Child Order created and disbursement initiated
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Child Order drawdown completed
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Base Order updated after drawdown success
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
      else Drawdown rejected
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Child Order drawdown rejected
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
      end
references: if any
steps:
- summary: The borrower initiates loan drawdown request using the reference id from base transaction
  api: init
  # stepName: Child Order
  details:
  - description: The borrower sends an init request with the requested drawdown amount.
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        rect rgb(191, 223, 255)
        Borrower Platform (BAP)->>Lender Platform (BPP): init-Request (DRAWDOWN on Base Order)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        end
        Lender Platform (BPP)->>Borrower Platform (BAP): on_init - Approved drawdown terms and consent required
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/init/init_request_drawdown.yaml
- summary: The lender returns approved drawdown terms and requests borrower consent.
  api: on_init
  # stepName: Child Order
  details:
  - description: The lender creates the child drawdown order, shares approved amount, charges, credit destination, and requests borrower consent before disbursement.
    mermaid: >-
       sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        
        Borrower Platform (BAP)->>Lender Platform (BPP): init-Request (DRAWDOWN on Base Order)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        rect rgb(191, 223, 255)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_init - Approved drawdown terms and consent required
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        end
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_init/on_init_request_drawdown.yaml

- summary: The borrower will provide the consnet for drawdown
  api: confirm
  # stepName: Child Order
  details:
  - description: The borrower will provide the consnet for drawdown
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        rect rgb(191, 223, 255)
        Borrower Platform (BAP)->>Lender Platform (BPP): confirm
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        end
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/confirm/confirm_request_drawdown.yaml
- summary: The lender will acknowledge the borrower's consent for disbursal
  api: on_confirm
  # stepName: Child Order
  details:
  - description: he lender will acknowledge the borrower's consent for disbursal
    mermaid: >-
       sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        
        Borrower Platform (BAP)->>Lender Platform (BPP): confirm
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        rect rgb(191, 223, 255)
        Lender Platform (BPP)->>Borrower Platform (BAP): on_confirm
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        end
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_confirm/on_confirm_request_drawdown.yaml


