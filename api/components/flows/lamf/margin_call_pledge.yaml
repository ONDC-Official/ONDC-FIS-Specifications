summary: LAMG - Margin Call(Units Pledged)
details:
  - description: Detailed process for Margin Call
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Borrower Platform (BAP)->>Lender Platform (BPP): update-Request
        Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update success
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK

references: if any
filepath: './loan-foreclouser.yaml'
steps:      
  - summary: The provider platform will send the on_update call with margin call data
    api: on_update
    details:
      - description: The provider platform will send the on_update call with margin call data
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_request_margin_call_term_5.yaml" 
  - summary: The borrower (BAP) will choose the margin call option
    api: update
    details:
      - description: The borrower (BAP) will choose the margin call option
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP):ACK

            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP):update-Request
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP):ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/update/update_request_margin_call_term.yaml"
  - summary: The provider platform will share the lien marking form.
    api: on_update
    details:
      - description: The provider platform will share the lien marking form.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - on_update success
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_request_margin_call_term_6.yaml"

  - summary: The borrower (BAP) will share the form submission id.
    api: update
    details:
      - description: The borrower (BAP) will share the form submission id.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP):update-Request
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP):ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/update/update_request_margin_call_lien.yaml"
  - summary: The provider platform will share the updated order.
    api: on_update
    details:
      - description: The provider platform will share the updated order.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Update request
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update - on_update success
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_request_margin_call_term_7.yaml"


        