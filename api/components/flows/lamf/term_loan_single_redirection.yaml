summary: LAMF - Term Loan with MFC (Single Redirection)
details:
  - description: Discovery of Funds
    mermaid: >-
      sequenceDiagram
        title LAMF Term Loan Discovery
        Borrower Platform (BAP)->>Gateway (BG): search
        Gateway (BG) ->> Borrower Platform (BAP): ACK
        Gateway (BG)->>Registry: Lookup Lender Platforms (lookup)
        Registry->>Gateway (BG): List of Lender Platforms (200 OK)
        Gateway (BG)->>Lender Platform(BPP): search
        Lender Platform(BPP)->>Gateway (BG) : ACK
        Lender Platform(BPP)->>Borrower Platform (BAP): Publish Catalog of Lender 1 (on_search)
        Borrower Platform (BAP)->>Lender Platform(BPP): ACK
  - description: Ordering
    mermaid: >-
      sequenceDiagram
        title  Selection
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        participant Lender Form Service
        Borrower Platform (BAP)->>Lender Form Service: Get Form(Personal Information)
        Lender Form Service-->>Borrower Platform (BAP): Form Received
        Borrower Platform (BAP)->>Lender Form Service: Form Submission
        Lender Form Service-->>Borrower Platform (BAP): Submission ID
        Borrower Platform (BAP)->>Lender Platform (BPP): select(with submissionID)
        Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_select
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  - description: Order Confirmation
    mermaid: >-
      sequenceDiagram
        title Order Confirmation
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        participant Lender Form Service
        Borrower Platform (BAP)->>Lender Form Service: Get Form(Single Redirection)
        Lender Form Service-->>Borrower Platform (BAP): Form Received
        Borrower Platform (BAP)->>Lender Form Service: Form Submission
        Lender Form Service-->>Borrower Platform (BAP): Submission ID
        Lender Platform (BPP)->>Borrower Platform (BAP):on_status
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  - description: Fulfillment
    mermaid: >-
      sequenceDiagram
        title Term Loan Disbursement
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Lender Platform (BPP)->>Borrower Platform (BAP):on_update - Disbursement and repayment schedule
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:

  - summary: The borrower shares the applicant details for the term loan form.
    api: search
    details:
      - description: The BAP initiates a search for LAMF term loan offerings within a
          specified geographic location and financial services domain, establishing
          the transaction identity and routing parameters for the credit discovery
          process.
        mermaid: >-
          sequenceDiagram
            title  LAMF Term Loan Discovery
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)

            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/search/search-request-term-loan-single-redirection.yaml"
  - summary: The BPP responds to the BAP's search inquiry with a catalog of
      available term loan product offerings matched to the specified location and
      domain context.
    api: on_search
    details:
      - description: The BPP responds to the BAP's search inquiry with a catalog of
          available term loan product offerings matched to the specified location and
          domain context.
        mermaid: >-
          sequenceDiagram
            title  LAMF Term Loan Discovery
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Borrower Platform (BAP)->>Lender Platform (BPP): search(with submissionID)
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_search/on_search_request_term_loan_single_redirection.yaml"


  - summary: BAP selects the term loan product from the BPP's catalog, confirming the
      customer's chosen offering and establishing the transaction parameters
      including location context for the term loan origination journey.
    api: select
    details:
      - description: BAP selects the term loan product from the BPP's catalog, confirming the
          customer's chosen offering and establishing the transaction parameters
          including location context for the term loan origination journey.
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/select/select_request_term_loan_single_redirection_1.yaml"
  - summary: BPP confirms the customer's selected term loan product and furnishes
      the order containing offer terms and application parameters for the
      customer to review and confirm.
    api: on_select
    details:
      - description: BPP confirms the customer's selected term loan product and furnishes
          the order containing offer terms, the term loan quote, and application
          parameters for the customer to review and confirm.
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_select/on_select_request_term_loan_single_redirection_1.yaml"


  - summary: The borrower receives form for single redirection journey
    api: form
    details:
      - description: The borrower receives form for KYC, Lien Marking, Emandate etc.
        mermaid: >-
          sequenceDiagram
            title Single Redirection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
           
    reference: if any
    example:
      value: 
        $ref: ../../examples/loan-against-mf/forms/loan-against-mf-kyc.html

  - summary: The BPP proactively notifies the BAP with unsolicited status
      updates on the term loan application's progress during the single redirection
      journey
    api: on_status
    details:
      - description: The BPP proactively notifies the BAP with unsolicited status
            updates on the term loan application's progress during the single redirection journey
        mermaid: >-
          sequenceDiagram
            title Single Redirection Progress
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_status/on_status_request_term_loan_single_redirection_1.yaml"
  - summary: The BPP proactively notifies the BAP with unsolicited status
      updates on the term loan application's progress during the single redirection
      journey
    api: on_status
    details:
      - description: The BPP proactively notifies the BAP with unsolicited status
            updates on the term loan application's progress during the single redirection journey
        mermaid: >-
          sequenceDiagram
            title Single Redirection Progress
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            
            Borrower Platform (BAP)->>Lender Form Service: Get Form(KYC)
            Lender Form Service-->>Borrower Platform (BAP): Form Received
            Borrower Platform (BAP)->>Lender Form Service: Form Submission
            Lender Form Service-->>Borrower Platform (BAP): Submission ID
           
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_status/on_status_request_term_loan_single_redirection_2.yaml"
  - summary: The BPP proactively notifies the BAP with unsolicited status
      updates on the term loan application's progress during the single redirection
      journey
    api: on_status
    details:
      - description: The BPP proactively notifies the BAP with unsolicited status
            updates on the term loan application's progress during the single redirection journey
        mermaid: >-
          sequenceDiagram
            title Single Redirection Progress
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_status/on_status_request_term_loan_single_redirection_3.yaml"
  - summary: The BPP proactively notifies the BAP with unsolicited status
      updates on the term loan application's progress during the single redirection
      journey
    api: on_status
    details:
      - description: The BPP proactively notifies the BAP with unsolicited status
            updates on the term loan application's progress during the single redirection journey
        mermaid: >-
          sequenceDiagram
            title Single Redirection Progress
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_status
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_status/on_status_request_term_loan_single_redirection_4.yaml"

  - summary: BAP shares the submission id of the single redirection form (Optional)
    api: select
    details:
      - description: BAP shares the submission id of the single redirection form (Optional).
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/select/select_request_term_loan_single_redirection_2.yaml"
  - summary: BPP confirms the customer's selected term loan product and furnishes
      the order containing offer terms and application parameters for the
      customer to review and confirm (Optional).
    api: on_select
    details:
      - description: BPP confirms the customer's selected term loan product and furnishes
          the order containing offer terms and application parameters for the
          customer to review and confirm (Optional).
        mermaid: >-
          sequenceDiagram
            title  Selection
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_select/on_select_request_term_loan_single_redirection_2.yaml"


  - summary: The lender confirms the term loan order.
    api: on_confirm
    details:
      - description: >-
          The BPP confirms the customer's term loan application and returns the
          sanctioned order with the term loan quote, the disbursement payment,
          and the repayment schedule to the BAP.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_confirm/on_confirm_request_term_loan_single_redirection.yaml"

  - summary: The lender disburses the term loan and updates the order once after
      disbursement with the repayment schedule.
    api: on_update
    details:
      - description: >-
          The BPP disburses the term loan in a single tranche and sends one
          unsolicited on_update. The order moves to DISBURSED, the disbursement
          payment is marked PAID, and the full installment repayment schedule is
          attached to the order.
        mermaid: >-
          sequenceDiagram
            title Post Disbursal Update
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_update (DISBURSED + repayment schedule)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_term_loan_disbursement.yaml"
