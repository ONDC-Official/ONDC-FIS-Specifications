summary: LAMF - Limit Enhancement
details:
- description: Detailed process for enhancing the sanctioned limit of an active LAMF credit line.
  mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (LIMIT_ENHANCEMENT)\n  Lender Platform (BPP)-->>Borrower Platform (BAP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Redirection URL and enhancement stops\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Portfolio fetch done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Fresh lien marking done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Fresh eSign done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Enhanced limit setup completed\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK"
references: if any
steps:
- summary: The borrower requests a limit enhancement.
  api: update
  details:
  - description: The borrower sends an update request with the requested enhanced limit.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (LIMIT_ENHANCEMENT)\n  Lender Platform (BPP)-->>Borrower Platform (BAP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/update/update_request_lamf_limit_enhancement.yaml
- summary: The lender returns the enhancement redirection URL and stops.
  api: on_status
  details:
  - description: The lender returns a redirection form and stop sequence for portfolio fetch, fresh lien marking, fresh eSign, and enhanced limit setup.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Redirection URL and enhancement stops\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_status/on_status_lamf_limit_enhancement_redirect.yaml
- summary: The lender confirms portfolio fetch completion for limit enhancement.
  api: on_status
  details:
  - description: The lender updates the BAP that portfolio fetch is complete and later enhancement stops are pending.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Portfolio fetch done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_status/on_status_lamf_limit_enhancement_portfolio_fetch.yaml
- summary: The lender confirms fresh lien marking completion for limit enhancement.
  api: on_status
  details:
  - description: The lender updates the BAP that fresh lien marking is complete and later enhancement stops are pending.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Fresh lien marking done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_status/on_status_lamf_limit_enhancement_fresh_lien_marking.yaml
- summary: The lender confirms fresh eSign completion for limit enhancement.
  api: on_status
  details:
  - description: The lender updates the BAP that fresh eSign is complete and enhanced limit setup is pending.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Fresh eSign done\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_status/on_status_lamf_limit_enhancement_fresh_esign.yaml
- summary: The lender confirms enhanced limit setup completion.
  api: on_status
  details:
  - description: The lender confirms that the portfolio fetch, fresh lien marking, fresh eSign, and enhanced limit setup stops are complete.
    mermaid: "sequenceDiagram\n  participant Borrower Platform (BAP)\n  participant Lender Platform (BPP)\n  rect rgb(191, 223, 255)\n  Lender Platform (BPP)->>Borrower Platform (BAP): on_status - Enhanced limit setup completed\n  Borrower Platform (BAP)-->>Lender Platform (BPP): ACK\n  end"
  reference: if any
  example:
    value:
      $ref: ../../examples/loan-against-mf/on_status/on_status_lamf_limit_enhancement_complete.yaml
