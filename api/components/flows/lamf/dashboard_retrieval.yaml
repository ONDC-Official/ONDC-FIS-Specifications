summary: LAMF - Dashboard Retrieval
details:
  - description: Detailed process for retrieving the current LAMF credit-line account summary and network-posted account transactions.
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (DASHBOARD_RETRIEVAL)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Account summary and transactions
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The borrower requests the LAMF dashboard.
    api: update
    details:
      - description: The borrower sends a servicing request with REQUEST_TYPE as DASHBOARD_RETRIEVAL.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (DASHBOARD_RETRIEVAL)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/update/update_request_lamf_dashboard_retrieval.yaml"
  - summary: The lender returns the account summary and account transactions.
    api: on_update
    details:
      - description: The lender returns the current account summary, pledged portfolio, and network-posted account transactions.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Account summary and transactions
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_dashboard_retrieval.yaml"
