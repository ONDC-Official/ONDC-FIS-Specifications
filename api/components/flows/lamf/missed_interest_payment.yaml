summary: LAMF - Missed Interest Payment
details:
  - description: Detailed process for paying missed interest on an active LAMF credit line.
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (MISSED_INTEREST_PAYMENT)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Missed interest quote
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Payment success
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The borrower requests the missed-interest payment details.
    api: update
    details:
      - description: The borrower sends an update request against payments with MISSED_INTEREST_PAYMENT as the payment label.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (MISSED_INTEREST_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/update/update_request_lamf_missed_interest.yaml"
  - summary: The lender returns the missed-interest amount payable.
    api: on_update
    details:
      - description: The lender shares the interest, penal charges, other charges, and payment URL.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Missed interest quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_missed_interest_quote.yaml"
  - summary: The lender confirms missed-interest payment success.
    api: on_update
    details:
      - description: The lender confirms that the missed-interest payment was received.
        mermaid: >-
          sequenceDiagram
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Payment success
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_missed_interest_success.yaml"
