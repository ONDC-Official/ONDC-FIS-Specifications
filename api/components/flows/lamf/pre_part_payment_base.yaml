summary: LAMF - Pre-Part Payment
details:
  - description: Detailed process for making a pre-part payment on an active LAMF credit line.
    mermaid: >-
      sequenceDiagram
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (PRE_PART_PAYMENT)
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Pre Part Payment quote
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Pre Part Payment success
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  - summary: The lender confirms the term loan order.
    api: on_confirm
    details:
      - description: >-
          The BPP confirms the customer's credit line application and returns
          the finalized transaction details and confirmation status to the BAP.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_confirm/on_confirm_request_single_redirection.yaml"
  - summary: The borrower (BAP) sends the update request by sending the order ID.
    api: update
    details:
      - description: The borrower sends an update request against payments with PRE_PART_PAYMENT as the payment label.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/update/update_request_lamf_pre_part.yaml"
  - summary: The lender returns the foreclosure quote.
    api: on_update
    details:
      - description: The lender shares outstanding principal, accrued interest, foreclosure charges, and other charges.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_pre_part_quote.yaml"
  - summary: The lender confirms foreclosure payment success.
    api: on_update
    details:
      - description: The lender confirms that the foreclosure payment was received.
        mermaid: >-
          sequenceDiagram
            title Order Confirmation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Lender Platform (BPP)->>Borrower Platform (BAP):on_confirm
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
           
            Borrower Platform (BAP)->>Lender Platform (BPP): update-Request (PRE_PART_PAYMENT)
            Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Lender Platform (BPP)->>Borrower Platform (BAP): on_update - Foreclosure quote
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/loan-against-mf/on_update/on_update_lamf_pre_part_success.yaml"
