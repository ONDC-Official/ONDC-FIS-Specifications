  - summary: User submits the GST and Bank Statement information
    reference: if any
    api: search
    example:
      value:
        $ref: ../../examples/Working-Capital-Loan/search/search-request_gst_submission_sole.yaml
    details:
      - description: User submits the GST and Bank Statement information
        mermaid: >-
          sequenceDiagram
            title  Order creation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            # participant Lender Form Service
            # Borrower Platform (BAP)->>Lender Form Service: Get Form(GST & Bank Statements)
            # Lender Form Service-->>Borrower Platform (BAP): Form Received
            # Borrower Platform (BAP)->>Lender Form Service: Form Submission
            # Lender Form Service-->>Borrower Platform (BAP): Submission ID
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  - summary: Lender provides a consent request with selected product
    reference: if any
    api: on_search
    example:
      value:
        $ref: ../../examples/Working-Capital-Loan/on_search/on_search_sole_consent.yaml
    details:
      - description: The lender platform generates a consent request for capturing borrower's consent.
        mermaid: >-
          sequenceDiagram
            title  Order creation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            participant Lender Form Service
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
           
  - summary: The borrower submit the form with the submission-id & provides consent.
    reference: if any
    api: search
    example:
      value:
        $ref: ../../examples/Working-Capital-Loan/search/search-request_gst_submission_sole_consent.yaml
    details:
      - description: The borrower submit the form with the submission-id & provides consent.
        mermaid: >-
          sequenceDiagram
            title  Order creation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search (offer)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
  - summary: The lender will provide working capital loan offer with all the loan
      details
    reference: if any
    api: on_search
    example:
      value:
        $ref: ../../examples/Working-Capital-Loan/on_search/on_search-offer-sole-prop.yaml
    details:
      - description: The lender will provide working capital loan offer with all the
          loan details
        mermaid: >-
          sequenceDiagram
            title  Order creation
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
           
            Borrower Platform (BAP)->>Lender Platform (BPP): search
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_search (offer)
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
            Borrower Platform (BAP)-->>Lender Platform (BPP): select (offer selection)
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
  - summary: The Borrower chooses one of the offer from the the list of offers from
      the lenders
    reference: if any
    api: select
    example:
      value:
        $ref: ../../examples/Working-Capital-Loan/select/select_loan_offer_sole_prop.yaml
    details:
      - description: The Borrower chooses one of the offer from the the list of offers
