summary: Dedupe Accepted
details:
  - description: The borrower app checks with the lender for a duplicate lead using PAN, date of birth and phone, before it asks for an offer. The lender accepts the request.
    mermaid: >-
      sequenceDiagram
        title Dedupe Check
        participant Borrower Platform (BAP)
        participant Lender Platform (BPP)
        Borrower Platform (BAP)->>Lender Platform (BPP): select
        Lender Platform (BPP)-->>Borrower Platform (BAP): ACK
        Lender Platform (BPP)->>Borrower Platform (BAP): on_select (ACCEPTED)
        Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
references: if any
steps:
  
  - summary: The borrower selects the dedupe item with PAN, date of birth and phone.
    api: select
    details:
      - description: The borrower selects the dedupe item with PAN, date of birth and phone.
        mermaid: >-
          sequenceDiagram
            title Dedupe Check
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)

            rect rgb(191, 223, 255) 
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            end
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/dedupe/select/select_request.yaml"
  - summary: The lender accepts the dedupe check (fulfillment state ACCEPTED).
    api: on_select
    details:
      - description: The lender accepts the dedupe check (fulfillment state ACCEPTED).
        mermaid: >-
          sequenceDiagram
            title Dedupe Check
            participant Borrower Platform (BAP)
            participant Lender Platform (BPP)
            
            Borrower Platform (BAP)->>Lender Platform (BPP): select
            Lender Platform (BPP)-->>Borrower Platform (BAP):ACK
            rect rgb(191, 223, 255) 
            Lender Platform (BPP)->>Borrower Platform (BAP):on_select
            Borrower Platform (BAP)-->>Lender Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/dedupe/on_select/on_select_request.yaml"
