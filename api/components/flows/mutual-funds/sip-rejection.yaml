summary: SIP Creation (New Folio) - Payment Failure
reference: https://github.com/ONDC-Official/ONDC-FIS-Specifications/blob/draft-FIS14-enhancements/api/components/docs/README.md#protocol-details

references: if any
steps:
  - summary: Select
    api: select
    details:
      - description: Scheme selection
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send back new folio input required
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio.json"
  - summary: Get Form
    api: form
    details:
      - description: Get the form for folio opening
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/account-opening.html"
  - summary: Submit Form
    api: select
    details:
      - description: Send folio information as form submission
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip-new-folio-1.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send success status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio-1.json"

  - summary: Initialize the SIP order
    api: init
    details:
      - description: Send order details and payment selection
        mermaid: |-
         sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/init/init-sip-new-folio.json"
  - summary: On Init
    api: on_init
    details:
      - description: Draft order is sent back with TnC and payment url
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_init/on_init-sip-new-folio.json"

  - summary: Confirm
    api: confirm
    details:
      - description: Send order confirmation
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/confirm/confirm-sip-new-folio.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send order acceptance
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
           
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/on_confirm-sip-new-folio.json"

  - summary: Payment
    api: form
    details:
      - description: Depending on the payment mode, buyer app either redirects the buyer to the PG url or show the payment option in its interface. This example is showing a redirection flow
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/payment-gateway.html"
  - summary: On Update
    api: on_update
    details:
      - description: Send payment failure
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-new-folio-pfailure.json"
