summary: SIP Modification - Skip Installment
details:
  - description: "This flow demonstrates how to skip installments in an ongoing SIP and how to cancel a skip request if it is no longer needed. Installments falling within the specified date range are generated with a fulfillment state of cancelled. Skipped installments count toward the total installment limit. The number of consecutive installments that can be skipped varies by frequency."

references: if any
steps:
  - summary: Update
    api: update
    details:
      - description: Update sip order to skip installment
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/update/update-sip-enable-skip-installment.json"
  - summary: On Update
    api: on_update
    details:
      - description: Send sip order with skip id
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-enable-skip-installments.json"
  - summary: Update
    api: update
    details:
      - description: Update sip order to disable skip installment
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/update/update-sip-disable-skip-installment.json"
  - summary: On Update
    api: on_update
    details:
      - description: Send sip order with skip id disabled
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-disable-skip-installments.json"
