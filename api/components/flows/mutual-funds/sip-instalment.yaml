summary: SIP Instalment

references: if any
steps:
  - summary: On Update
    api: on_update
    details:
      - description: Send parent order fulfillment ongoing status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-new-folio-acceptance-ongoing.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send instalment order generation notification
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/on_confirm-sip-new-folio-instalment-acceptance.json"
  - summary: On Update (with payment details)
    api: on_update
    details:
      - description: Send instalment order with payment details for processing
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-instalment-with-payments.json"
  - summary: On Status (successful instalment payment)
    api: on_status
    details:
      - description: Successful sip instalment payment notification
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_status/on_status-sip-new-folio-instalment-psuccess.json"
  - summary: On Update (successful instalment)
    api: on_update
    details:
      - description: Successful sip instalment notification
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-new-folio-instalment-acceptance-success.json"
