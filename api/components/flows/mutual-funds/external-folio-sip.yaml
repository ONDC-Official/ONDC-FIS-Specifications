summary: External Folio - SIP
details:
  - description: "As there is no selection required, the buyer app can start the transaction from `init` call also if the seller app supports that. After `on_confirm`, the remaining flow related to payment and on update is the same as regular sip transactions, hence not showing in the flow below. If first instalment has to be generated immediately, buyer app passes the optional `instructions` attribute in the fulfillment stop next to `time` attribute. eg. `\"instructions\": { \"code\": \"GENERATE_FIRST_INSTALMENT\" }`"

references: if any
steps:
  - summary: Select
    api: select
    details:
      - description: Scheme selection
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/external_folios/select-sip-external-folio.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send back the payment options
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/external_folios/on_select-sip-external-folio.json"

  - summary: Initialize the SIP order
    api: init
    details:
      - description: Send order details and folio details
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/init/external_folios/init-sip-external-folio.json"
  - summary: On Init
    api: on_init
    details:
      - description: Draft order is sent back with payment url
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_init/external_folios/on_init-sip-external-folio.json"

  - summary: Confirm
    api: confirm
    details:
      - description: Send order confirmation
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/confirm/external_folios/confirm-sip-external-folio.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send order acceptance
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/external_folios/on_confirm-sip-external-folio.json"
