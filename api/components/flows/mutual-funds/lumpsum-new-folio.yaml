summary: Lumpsum - New Folio

references: if any
steps:
  - summary: Select
    api: select
    details:
      - description: Scheme selection
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-lumpsum.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send back new account input required
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-lumpsum-new-folio.json"
  - summary: Get Form
    api: form
    details:
      - description: Get the form for account opening
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/account-opening.html"

  - summary: Select
    api: select
    details:
      - description: Send folio information as form submission
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
           
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-lumpsum-new-folio-1.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send success status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
           
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-lumpsum-new-folio-1.json"      

  - summary: Initialize the Lumpsum order
    api: init
    details:
      - description: Send order details and folio details
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/init/init-lumpsum-new-folio.json"
  - summary: On Init
    api: on_init
    details:
      - description: Draft order is sent back with payment url
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_init/on_init-lumpsum-new-folio.json"

  - summary: Confirm
    api: confirm
    details:
      - description: Send order confirmation
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/confirm/confirm-lumpsum-new-folio.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send order acceptance
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/on_confirm-lumpsum-new-folio.json"

  - summary: Payment
    api: form
    details:
      - description: Depending on the payment mode, buyer app either redirects the buyer to the PG url or show the payment option in its interface. This example is showing a redirection flow
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/payment-gateway.html"
  - summary: On Status
    api: on_status
    details:
      - description: Send order acceptance
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): on_status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_status/on_status-lumpsum-new-folio-psuccess.json"      

  - summary: On Update
    api: on_update
    details:
      - description: Send payment failure notification
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): on_status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-lumpsum-new-folio-psuccess-fsuccess.json"
