summary: SIP Creation (New Folio w/ KYC)
details:
  - description: "If first instalment has to be generated immediately, buyer app passes the optional `instructions` attribute in the fulfillment stop next to `time` attribute. eg. `\"instructions\": { \"code\": \"GENERATE_FIRST_INSTALMENT\" }`"

references: if any
steps:
  - summary: Select
    api: select
    details:
      - description: Scheme selection
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send back new folio + kyc input required
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio-with-kyc.json"
  - summary: Get Form
    api: form
    details:
      - description: Get the form for folio+kyc
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            end
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/account-opening-with-kyc.html"

  - summary: Submit Form
    api: select
    details:
      - description: Send folio information as form submission
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip-new-folio-with-kyc-1.json"
  - summary: On Select
    api: on_select
    details:
      - description: Ask for digilocker fetch
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio-with-kyc-1.json"
  - summary: Get Form
    api: form
    details:
      - description: Get the form for digilocker fetch
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            end
           
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/account-opening-kyc-digilocker.html"
  - summary: Seller provides the buyer with latest update of form status.
    api: on_status
    details:
      - description:  Seller provides the buyer with latest update of form status from unsolicited call.
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_status/on_status-sip-new-folio-with-kyc-f2submitted.json"

  - summary: Submit Form
    api: select
    details:
      - description: Send digilocker fetch as form submission
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip-new-folio-with-kyc-2.json"
  - summary: On Select
    api: on_select
    details:
      - description: Ask for esign
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio-with-kyc-2.json"
  - summary: Get Form
    api: form
    details:
      - description: Get the form for esign
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/account-opening-kyc-esign.html"
  - summary: Seller provides the buyer with latest update of form status.
    api: on_status
    details:
      - description:  Seller provides the buyer with latest update of form status from unsolicited call.
        mermaid: |-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            participant Seller Form Service
            
            Buyer Platform (BAP)->> Seller Form Service: Get Form
            Seller Form Service-->>Buyer Platform (BAP): Form Received
            Buyer Platform (BAP)->>Seller Form Service: Form Submission
            Seller Form Service-->>Buyer Platform (BAP): Submission ID   
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_status
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_status/on_status-sip-new-folio-with-kyc-f3submitted.json"      

  - summary: Submit Form
    api: select
    details:
      - description: Send esign fetch as form submission
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/select-sip-new-folio-with-kyc-3.json"
  - summary: On Select
    api: on_select
    details:
      - description: Send success status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): select
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_select
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/on_select-sip-new-folio-with-kyc-3.json"

  - summary: Initialize the SIP order
    api: init
    details:
      - description: Send order details and payment selection
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/init/init-sip-new-folio-with-kyc.json"
  - summary: On Init
    api: on_init
    details:
      - description: Draft order is sent back with TnC and payment url
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): init
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP): on_init
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_init/on_init-sip-new-folio-with-kyc.json"

  - summary: Confirm
    api: confirm
    details:
      - description: Send order confirmation
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/confirm/confirm-sip-new-folio-with-kyc.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send order acceptance
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            
            Buyer Platform (BAP)->>Seller Platform (BPP): confirm
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_confirm
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/on_confirm-sip-new-folio-with-kyc.json"

  - summary: Payment
    api: form
    details:
      - description: Depending on the payment mode, buyer app either redirects the buyer to the PG url or show the payment option in its interface. This example is showing a redirection flow
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/forms/payment-gateway.html"
  - summary: On Status
    api: on_status
    details:
      - description: Send payment success and order in accepted state
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            rect rgb(191, 223, 255)
            Buyer Platform (BAP)->>Seller Platform (BPP): on_status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            end
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_status/on_status-sip-new-folio-with-kyc-psuccess.json"
  - summary: On Update
    api: on_update
    details:
      - description: Send fulfillment started notification with ongoing status
        mermaid: >-
          sequenceDiagram
            participant Buyer Platform (BAP)
            participant Seller Platform (BPP)
            Buyer Platform (BAP)->>Seller Platform (BPP): on_status
            Seller Platform (BPP)-->>Buyer Platform (BAP):ACK
            rect rgb(191, 223, 255)
            Seller Platform (BPP)->>Buyer Platform (BAP):on_update
            Buyer Platform (BAP)-->>Seller Platform (BPP): ACK
            end
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_update/on_update-sip-new-folio-with-kyc-psuccess-fstarted.json"
