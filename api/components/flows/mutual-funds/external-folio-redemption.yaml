summary: External Folio - Redemption
details:
  - description: As there is no selection required, the buyer app can start the transaction from `init` call also if the seller app supports that. After `on_confirm`, the remaining flow related to payment and on update is the same as regular redemption transactions, hence not showing in the flow below.

references: if any
steps:
  - summary: Select folio
    api: select
    details:
      - description: Select redemption in a particular folio (external)
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/select/external_folios/select-redemption-external-folio.json"
  - summary: On Select
    api: on_select
    details:
      - description: Get the payment options back
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_select/external_folios/on_select-redemption-external-folio.json"

  - summary: Initialize the Redemption order for external folio
    api: init
    details:
      - description: Send order details and folio details
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/init/external_folios/init-redemption-external-folio.json"
  - summary: On Init
    api: on_init
    details:
      - description: Draft order is sent back
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_init/external_folios/on_init-redemption-external-folio.json"

  - summary: Confirm
    api: confirm
    details:
      - description: Send order confirmation
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/confirm/external_folios/confirm-redemption-external-folio.json"
  - summary: On Confirm
    api: on_confirm
    details:
      - description: Send order acceptance
    reference: if any
    example:
      value:
        $ref: "../../examples/mutual-funds/on_confirm/external_folios/on_confirm-redemption-external-folio.json"
