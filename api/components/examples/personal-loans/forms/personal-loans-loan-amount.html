<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Required Loan Value</title>
</head>

<body>
  <form action="/form/submission/loan-amount">
    <label for="requestAmount">Requested Loan Amount</label>
    <input type="text" id="requestAmount" name="requestAmount" />

    <label for="requestTerm">Requested Loan Term</label>
    <input type="text" id="requestTerm" name="requestTerm" />

    <label for="insuranceProductName">Insurance Product Name</label>
    <input type="text" id="insuranceProductName" name="insuranceProductName" />

    <label for="insuranceProductCoverAmount">Insurance Product Cover Amount</label>
    <input type="text" id="insuranceProductCoverAmount" name="insuranceProductCoverAmount" />

    <label for="insuranceProductFee">Insurance Product Fee</label>
    <input type="text" id="insuranceProductFee" name="insuranceProductFee" />

    <label for="insuranceTaxAmount">Insurance Tax Amount</label>
    <input type="text" id="insuranceTaxAmount" name="insuranceTaxAmount" />

    <label for="insuranceTotalFee">Insurance Total Fee</label>
    <input type="text" id="insuranceTotalFee" name="insuranceTotalFee" />

    <label for="deductFromLoanDisbursal">Deduct from loan disbursal</label>
    <input type="checkbox" id="deductFromLoanDisbursal" name="deductFromLoanDisbursal"/>


    <input type="hidden" id="formId" name="formId" value="FO2">
    <input type="submit" value="Submit">
  </form>
</body>

</html>
