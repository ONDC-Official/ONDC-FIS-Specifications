<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details</title>
</head>

<body>
  <form action="/form/submission/user-details">

    <label for="userType">User Type</label>
    <select name="userType" id="userType">
      <option value="individual">Individual</option>
      <option value="solePropFirm">Sole Prop</option>
    </select>

    <label for="pan">PAN</label>
    <input type="text" id="pan" name="pan" required />
    
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" required />

    <label for="constitution">Constitution</label>
    <select name="constitution" id="constitution">
      <option value="partnershipFirm">Partnership firm</option>
      <option value="etc">ETC</option>
    </select>

    <label for="gender">Gender</label>
    <select name="gender" id="gender" required>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="transgender">Transgender</option>
    </select>

    <label for="employmentType">Employment type</label>
    <select name="employmentType" id="employmentType">
      <option value="salaried">Salaried</option>
      <option value="selfEmployed">Self Employment</option>
    </select>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required />

    <label for="annualIncome">Annual Income</label>
    <input type="number" id="annualIncome" name="annualIncome" />

    <label for="mobileNumber">Mobile Number</label>
    <input type="text" id="mobileNumber" name="mobileNumber" required />

    <label for="emailId">Email Id</label>
    <input type="text" id="emailId" name="emailId" />

    <label for="addressL1">Address Line 1</label>
    <input type="text" id="addressL1" name="addressL1" />
    <label for="addressL2">Address Line 2</label>
    <input type="text" id="addressL2" name="addressL2" />

    <label for="pincode">Pin Code</label>
    <input type="text" id="pincode" name="pincode" required/>

    <label for="city">City</label>
    <input type="text" id="city" name="city" />

    <label for="state">State</label>
    <input type="text" id="state" name="state" />

    <label for="endUse">End Use</label>
    <select name="endUse" id="endUse">
      <option value="consumerDurablePurchase">Purchase of Consumer Durables</option>
      <option value="education">Education</option>
      <option value="travel">Travel</option>
      <option value="health">Health</option>
      <option value="other">Other Consumption Purposes</option>
    </select>

    <label for="bureauConsent">Bureau Consent</label>
    <input type="checkbox" id="bureauConsent" name="bureauConsent" required/>

    <label for="aa_id">Account Aggregator ID</label>
    <input type="text" id="aa_id" name="aa_id"/>



    <input type="hidden" id="formId" name="formId" value="FO1">
    <input type="submit" value="Submit">
  </form>
</body>

</html>
