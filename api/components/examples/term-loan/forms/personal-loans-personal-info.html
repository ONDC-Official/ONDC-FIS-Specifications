<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details</title>
</head>

<body>
  <form action="/form/submission/user-details">
    <p>Individual details:</p>
    <label for="pan">PAN</label>
    <input type="text" id="pan" name="pan" required />

    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" required />

    <label for="dob">DOB</label>
    <input type="date" id="dob" name="dob" required />

    <label for="addressL1">Address Line 1</label>
    <input type="text" id="addressL1" name="addressL1" />

    <label for="addressL2">Address Line 2</label>
    <input type="text" id="addressL2" name="addressL2" />

    <label for="pincode">Pin Code</label>
    <input type="text" id="pincode" name="pincode" required/>

    <label for="city">City</label>
    <input type="text" id="city" name="city" />

    <label for="state">State</label>
    <input type="text" id="state" name="state" />

    <p>Business details:</p>
    <label for="constitution">Constitution</label>
    <select name="constitution" id="constitution" required>
      <option value="selfEmployed">SELF EMPLOYED</option>
      <option value="selfEmployedProfessionalDoctor">SELF EMPLOYED PROFESSIONAL- DOCTOR</option>
      <option value="selfEmployedProfessionalOthers">SELF EMPLOYED PROFESSIONAL-OTHERS</option>
      <option value="solePropFirm">SOLE PROP FIRM</option>
      <option value="partnershipFirm">PARTNERSHIP FIRM</option>
      <option value="privateLimited">PRIVATE LIMITED</option>
      <option value="llp">LLP</option>
      <option value="etc">ETC</option>
    </select>


    <label for="businessPan">Business PAN</label>
    <input type="text" id="businessPan" name="businessPan" required/>

    <label for="businessPanName">Name as Per Business PAN</label>
    <input type="text" id="businessPanName" name="businessPanName" />

    <label for="doi">DOI</label>
    <input type="text" id="doi" name="doi" required/>


    <label for="natureOfBusiness">Nature of business</label>
    <select name="natureOfBusiness" id="natureOfBusiness" required>
      <option value="trading">Trading</option>
      <option value="service">Service</option>
      <option value="manufacturing">Manufacturing</option>
    </select>

    <label for="udyamNumber">UDYAM Number</label>
    <input type="text" id="udyamNumber" name="udyamNumber" />

    <label for="gst">GST</label>
    <input type="text" id="gst" name="gst" />

    <label for="annualTurnover">Annual Turnover</label>
    <input type="text" id="annualTurnover" name="annualTurnover"  required/>

    <label for="businessEmail">Email Id</label>
    <input type="text" id="businessEmail" name="businessEmail" />


    <label for="businessAddressL1">Business Address Line 1</label>
    <input type="text" id="businessAddressL1" name="businessAddressL1" />

    <label for="businessAddressL2">Business Address Line 2</label>
    <input type="text" id="businessAddressL2" name="businessAddressL2" />

    <label for="businessPincode">Pin Code</label>
    <input type="text" id="businessPincode" name="businessPincode" required/>

    <label for="businessCity">City</label>
    <input type="text" id="businessCity" name="businessCity" />

    <label for="businessState">State</label>
    <input type="text" id="businessState" name="businessState" />


    <label for="endUse">End Use</label>
    <select name="endUse" id="endUse">
      <option value="businessExpansion">Business expansion</option>
      <option value="workingCapital">Working Capital</option>
    </select>

    <label for="bureauConsent">Bureau Consent</label>
    <input type="checkbox" id="bureauConsent" name="bureauConsent" />


    <input type="hidden" id="formId" name="formId" value="FO1">
    <input type="submit" value="Submit">
  </form>
</body>

</html>
