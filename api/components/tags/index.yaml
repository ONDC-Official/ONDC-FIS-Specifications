search:
  message:
    intent:
      tags:
        $ref: "./tag-group.yaml#/bap-terms"
on_search:
  message:
    catalog:
      $ref: "./tag-group.yaml#/catalog"
on_select:
  message:
    order:
      items: &items
        $ref: "./tag-group.yaml#/order/items"
init:
  message:
    order:
      tags:
        $ref: "./tag-group.yaml#/bap-terms"
on_init:
  message:
    order:
      items: *items
      tags:
        $ref: "./tag-group.yaml#/bpp-terms"
confirm:
  message:
    order:
      tags:
        list:
          $ref: "./tag-group.yaml#/terms"
on_confirm:
  message:
    order:
      $ref: "./tag-group.yaml#/order"
on_status:
  message:
    order:
      items: *items
