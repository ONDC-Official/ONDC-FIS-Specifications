search:
  message:
    intent:
      # payment: &payment
      #   $ref: "./tag-group.yaml#/payment"
      tags: &bapTerms
        $ref: "./tag-group.yaml#/bapTerms" 
on_search:
  message:
    catalog:
      providers:
        items: &items
          $ref: "./tag-group.yaml#/items"
      tags: &bppTerms
        $ref: "./tag-group.yaml#/bppTerms" 
select:
  message:
    order:
      items: *items
on_select:
  message:
    order:
      items: *items
init: 
  message:
    order:
      tags: *bapTerms
on_init:
  message:
    order:
      items: *items
      payments: &payment
        $ref: "./tag-group.yaml#/payment"
      tags: *bppTerms  

confirm: &ref1
  message:
    order:
      items: *items
      tags: 
        - $ref: "./tag-group.yaml#/bapTerms/0" 
        - $ref: "./tag-group.yaml#/bppTerms/0"         
on_confirm: *ref1
on_status: &ref0
  message:
    order:
      items: *items
      payments: *payment
      fulfillments: 
        $ref: "./tag-group.yaml#/fulfillments"
      tags: 
        - $ref: "./tag-group.yaml#/bapTerms/0" 
        - $ref: "./tag-group.yaml#/bppTerms/0"  
on_cancel: *ref0
on_update: *ref0
