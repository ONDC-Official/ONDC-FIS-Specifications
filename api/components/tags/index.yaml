search:
  message:
    intent:
      payment:
        $ref: "./tag-group.yaml#/payment"
on_search:
  message:
    catalog:
      $ref: "./tag-group.yaml#/catalog"
      payments:
        $ref: "./tag-group.yaml#/payment"
        
on_select:
  message:
    order:
      provider: &providerTags
        tags:
          $ref: "./tag-group.yaml#/catalog/providers/tags"
      items: &items
        $ref: "./tag-group.yaml#/order/items"
init:
  message:
    order:
      payments: &payments
        $ref: "./tag-group.yaml#/payment"
on_init:
  message:
    order:
      provider: *providerTags
      items: *items
      payments: *payments
confirm:
  message:
    order:
      payments: &payments
        $ref: "./tag-group.yaml#/payment"     
on_confirm:
  message:
    order: &order
      $ref: "./tag-group.yaml#/order"
      payments: *payments
on_status:
  message:
    order: *order
on_update:
  message:
    order: *order