search:
  message:
    intent:
      $ref: "./tag-group.yaml#/intent"

on_search:
  message:
    catalog:
      providers:
        items: &items
          $ref: "./tag-group.yaml#/items"
        fulfillments: &fulfillments
          $ref: "./tag-group.yaml#/fulfillments"
      tags: &BPP_TERMS
        $ref:  "./tag-group.yaml#/BPP_TERMS"

select:
  message:
    order:
      tags: &BAP_TERMS
        $ref:  "./tag-group.yaml#/BAP_TERMS"

on_select:
  message:
    order:
      items: *items
      fulfillments:
        tags:
          - &fulfillment1
            $ref: "./tag-group.yaml#/order/fulfillments/tags/0"
          - &fulfillment3
            $ref: "./tag-group.yaml#/order/fulfillments/tags/3"
          - &thresholds
            $ref: "./tag-group.yaml#/fulfillments/tags/0"
      payments:
        tags:
          - &paymentMethod
            $ref: "./tag-group.yaml#/order/payments/tags/0"
      tags: *BPP_TERMS

init:
  message:
    order:
      tags: *BAP_TERMS
      fulfillments:
        tags:
          - *fulfillment3
          - *thresholds
      payments:
        tags:
          - *paymentMethod

on_init:
  message:
    order:
      items: *items
      fulfillments:
        tags:
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/0"
          - &payoutBankAccount
            $ref: "./tag-group.yaml#/order/fulfillments/tags/3"
          - *thresholds

      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
      tags: *BPP_TERMS


confirm:
  message:
    order:
      tags: &BAP_BPP_TERMS
        -  $ref: "./tag-group.yaml#/BAP_TERMS/0"
        -  $ref: "./tag-group.yaml#/BPP_TERMS/0"
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
      fulfillments:
        tags:    
          - *payoutBankAccount

on_confirm:
  message:
    order:
      items: *items
      fulfillments:
        tags:
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/0"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/3"
          - *thresholds
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
      tags: *BAP_BPP_TERMS

on_status:
  message:
    order:
      items: *items
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/1"
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
      fulfillments:
        tags:
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/0"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/1"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/2"
          - *thresholds
      tags: *BAP_BPP_TERMS    

cancel:
  message:
    tags:
      $ref: "./tag-group.yaml#/CONSUMER_INFO"

on_cancel:
  message:
    order:
      items: *items
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/1"
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
      fulfillments:
        tags:
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/1"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/2"
          - *thresholds
      tags:
        -  $ref: "./tag-group.yaml#/BAP_TERMS/0"
        -  $ref: "./tag-group.yaml#/BPP_TERMS/0"
        -  $ref: "./tag-group.yaml#/CONSUMER_INFO/0"
update:
  message:
    order:
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
on_update:
  message:
    order:
      items: *items
      payments:
        tags:
          - $ref: "./tag-group.yaml#/order/payments/tags/0"
          - $ref: "./tag-group.yaml#/order/payments/tags/1"
      fulfillments:
        tags:
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/0"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/1"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/2"
          - $ref: "./tag-group.yaml#/order/fulfillments/tags/3"
          - *thresholds
      tags: *BAP_BPP_TERMS        

                     


