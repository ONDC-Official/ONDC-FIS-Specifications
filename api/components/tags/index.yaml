search:
  message:
    intent:
      payment:
        $ref: "./tag-group.yaml#/payment"
on_search:
  message:
    catalog:
      providers:
        $ref: "./tag-group.yaml#/order/provider"
        items:
          $ref: "./tag-group.yaml#/order/items"
      payments:
        $ref: "./tag-group.yaml#/payment"
on_select:
  message:
    order:
      provider: &provider
        $ref: "./tag-group.yaml#/order/provider"
      items: &items
        $ref: "./tag-group.yaml#/order/items"
init:
  message:
    order:
      payments: &payments
        $ref: "./tag-group.yaml#/payment"
on_init:
  message:
    order: &order
      items: *items
      payments: *payments
      provider: *provider
confirm:
  message:
    order:
      payments: &payments
        $ref: "./tag-group.yaml#/payment"      
on_confirm:
  message:
    order: *order
on_status:
  message:
    order: *order
on_update:
  message:
    order: *order
