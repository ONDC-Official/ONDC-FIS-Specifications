general-info:
  - code: WELCOME_BENEFIT           
    description : Introductory perks offered upon card activation, such as bonus points or vouchers
    reference: <PR/Issue/Discussion Links md format text>
  - code: ANNUAL_FEE           
    description : Yearly charge applied for maintaining the credit card account
    reference: <PR/Issue/Discussion Links md format text>
  - code: JOINING_FEE       
    description : One-time fee charged when issuing or activating the credit card
    reference: <PR/Issue/Discussion Links md format text>
  - code: APR           
    description : Annual Percentage Rate, indicating yearly cost of borrowing on outstanding balances
    reference: <PR/Issue/Discussion Links md format text>
  - code: REWARDS           
    description : Points, cashback, or miles earned for card usage across transactions
    reference: <PR/Issue/Discussion Links md format text>
  - code: TRAVEL_BENEFITS   
    description : Perks like lounge access, travel insurance, or flight discounts for cardholders
    reference: <PR/Issue/Discussion Links md format text>
  - code: LIFESTYLE_BENEFITS
    description : Privileges on dining, shopping, entertainment, or wellness offered by the card
    reference: <PR/Issue/Discussion Links md format text>
  - code: EVERYDAY_BENEFITS
    description : Savings or rewards on daily expenses such as fuel, groceries, or utilities
    reference: <PR/Issue/Discussion Links md format text>
buyer-finder-fees:
  - code: BUYER_FINDER_FEES_TYPE
    description: Buyer finder fee type.
    reference: <PR/Issue/Discussion Links md format text>
    list: 
      - code: "amount"
        description: Describes, the Buyer App’s fee is a flat amount in INR.
        reference: <PR/Issue/Discussion Links md format text>
      - code: "percent- annualized"
        description: Describes, the Buyer App’s fee is set as a percentage of the Total Loan Disbursed for a 12-month tenure loan.
        reference: <PR/Issue/Discussion Links md format text>
      - code: "percent"
        description: Describes, the Buyer App’s fee is an absolute percentage.
        reference: <PR/Issue/Discussion Links md format text>    
  - code: BUYER_FINDER_FEES_PERCENTAGE
    description: Buyer finder fee in percentage
    reference: <PR/Issue/Discussion Links md format text>    
settlement-terms:
  - code: SETTLEMENT_WINDOW
    description: Time window to complete settlement for the loan
    reference: <PR/Issue/Discussion Links md format text>
  - code: SETTLEMENT_BASIS
    description: Basis required to complete settlement
    reference: <PR/Issue/Discussion Links md format text>
  - code: SETTLEMENT_TYPE
    description: Payment method to complete settlement
    reference: <PR/Issue/Discussion Links md format text>
  - code: MANDATORY_ARBITRATION
    description: Flag to denote if dispute can be resolved through arbitration
    reference: <PR/Issue/Discussion Links md format text>
  - code: COURT_JURISDICTION
    description: Denotes court that will have jurisdiction for the case
    reference: <PR/Issue/Discussion Links md format text>
  - code: DELAY_INTEREST
    description: Denotes interest to be paid as a delay charge
    reference: <PR/Issue/Discussion Links md format text>
  - code: STATIC_TERMS
    description: Terms for settlement
    reference: <PR/Issue/Discussion Links md format text>
  - code: SETTLEMENT_AMOUNT
    description: Denotes settlement amount
    reference: <PR/Issue/Discussion Links md format text>
  - code: OFFLINE_CONTRACT
    description: Denotes offline contract
    reference: <PR/Issue/Discussion Links md format text>
