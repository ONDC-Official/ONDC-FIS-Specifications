  - code: BUYER_PED
    description: Describes the PED details, which can be set to either true or false.
    reference: <PR/Issue/Discussion Links md format text>
  - code: TENURE_TYPE
    description: Describes the tenure type details.
    reference: <PR/Issue/Discussion Links md format text>  


