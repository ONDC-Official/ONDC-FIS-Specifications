bap_inputs:
  - code: BUYER_NAME
    description: Describes the format as  'Salutation | First Name | Middle Name | Last Name' represents a full name structure, where the values are separated by a pipe (|) symbol
    reference: <PR/Issue/Discussion Links md format text>
  - code: BUYER_PHONE_NUMBER
    description: >-
      Describes the format as: the first two characters represent the country code, followed by a 10-digit mobile number, separated by a hyphen (-).
    reference: <PR/Issue/Discussion Links md format text>
  - code: BUYER_PAN_NUMBER
    description: Describes the PAN number in alphanumeric format
    reference: <PR/Issue/Discussion Links md format text>
  - code: DERIVED_DATA
    description: Describes the derived data in the form of a URL pointing to a JSON file.
    reference: <PR/Issue/Discussion Links md format text>
  - code: PRODUCT_CATEGORY
    description: Describes the product category as Food, Grocery etc.
    reference: <PR/Issue/Discussion Links md format text>
  - code: ORDER_ID
    description: Describes the order id in alphanumeric format
    reference: <PR/Issue/Discussion Links md format text>
  - code: ORDER_VALUE
    description: >-
      Describes the order value as a numeric amount, Eg.: 1000
    reference: <PR/Issue/Discussion Links md format text>
  - code: ORDER_TYPE
    description: >-
       Describes the order type Eg.: Smartphone, TV, Ice Cream
    reference: <PR/Issue/Discussion Links md format text>
  - code: ORDER_WEIGHT
    description: Describes the order weight
    reference: <PR/Issue/Discussion Links md format text>
  - code: START_ADDRESS
    description: Describes the start address, including the pincode location.
    reference: <PR/Issue/Discussion Links md format text>
  - code: END_ADDRESS
    description: Describes the end address, including the pincode location.
    reference: <PR/Issue/Discussion Links md format text>
  - code: PAYMENT_MODE
    description: >-
      Describes the payment mode Eg.: Prepaid, COD 
    reference: <PR/Issue/Discussion Links md format text>
  - code: TRANSIT_START_DATE
    description: >-
      Describes the transit start date, as: DD/MM/YYYY, separated by a forward slash ( / ).
    reference: <PR/Issue/Discussion Links md format text>
  - code: TRANSIT_END_DATE
    description: >-
      Describes the transit end date, as: DD/MM/YYYY, separated by a forward slash ( / ).
    reference: <PR/Issue/Discussion Links md format text>
  - code: PACKAGING_TYPE
    description: >-
      Describes the packaging type, Eg.: Paper Bags, Corrugated Bag, Cardboard Box  
    reference: <PR/Issue/Discussion Links md format text>
  - code: PACKAGING_VIDEO
    description: >-
      Describes the packaging video tag value, including the URL, format type, and validity period separated by pipe (|) symbol <br>Eg.: ( url | format_type | validity ). <br> Possible value:  https://fis.test.bap.io/uploads/videos | .mp4, .mov, .mkv | P5D.
    reference: <PR/Issue/Discussion Links md format text>

  - code: SEALING_TYPE
    description: Describes the sealing type
    reference: <PR/Issue/Discussion Links md format text>

  - code: WATERPROOFING
    description: Describes the waterproofing type
    reference: <PR/Issue/Discussion Links md format text>

  - code: MODE_OF_TRANSPORT
    description: Describes the mode of transport
    reference: <PR/Issue/Discussion Links md format text>

  - code: LOGISTICS_COST
    description: >-
      Describes the logistics cost <br>Eg.: 1000
    reference: <PR/Issue/Discussion Links md format text>

  - code: ORDERS_ONTIME_PCT
    description: >-
      Descriebs percentage of orders that were shipped on or before the scheduled time. <br> Eg.: 90 %
    reference: <PR/Issue/Discussion Links md format text>
  - code: LOGISTICS_PARTNER_GSTIN
    description: >-
      Describes the logistics partner gstin. Eg.:ABCDE1234F
    reference: <PR/Issue/Discussion Links md format text>
  - code: DELIVERY_EXECUTIVE_NAME
    description: Describes the delivery executive name in the format as  'Salutation | First Name | Middle Name | Last Name' represents a full name structure, where the values are separated by a pipe (|) symbol
    reference: <PR/Issue/Discussion Links md format text>
  - code: DELIVERY_EXECUTIVE_PHONE_NO
    description: >-
      Describes the format as: the first two characters represent the country code, followed by a 10-digit mobile number, separated by a hyphen (-).
    reference: <PR/Issue/Discussion Links md format text>
  - code: DELIVERY_EXECUTIVE_UNIQUE_ID
    description: >-
      Describes the delivery executive unique id(Aadhar). Eg.: 88141 1344 123
    reference: <PR/Issue/Discussion Links md format text>
  - code: DELIVERY_EXECUTIVE_VEHICLE_NO
    description: Describes the delivery executive vehicle no
    reference: <PR/Issue/Discussion Links md format text>
  
  #hospicash insurance
  - code: BUYER_DOB
    description: >-
      Describes the format as: DD/MM/YYYY, separated by a forward slash ( / ).
    reference: <PR/Issue/Discussion Links md format text>
  - code: BUYER_GENDER
    description: Describes the values as male, female & transgender.
    reference: <PR/Issue/Discussion Links md format text>
  - code: SUM_INSURED
    description: >-
      Describes the format as: a numerical value without separators
    reference: <PR/Issue/Discussion Links md format text>
  - code: BUYER_EMAIL
    description: Describes the buyer email
    reference: <PR/Issue/Discussion Links md format text>
  - code: TENURE
    description: >-
      Describes the tenure in ISO 8601 duration format like P6M = 6 months &  P1Y = 1 year etc.
    reference: <PR/Issue/Discussion Links md format text>

