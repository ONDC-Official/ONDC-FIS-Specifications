scheme_info:
  - code: STATUS
    description: Status of the scheme
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: active
        description: Scheme is active
        reference: <PR/Issue/Discussion Links md format text>
      - code: suspended
        description: Scheme is suspended
        reference: <PR/Issue/Discussion Links md format text>
  - code: LOCKIN_PERIOD_IN_DAYS
    description: Lockin period if applicable
    reference: <PR/Issue/Discussion Links md format text>
  - code: NFO_START_DATE
    description: Start date of NFO, applicable only for NFOs
    reference: <PR/Issue/Discussion Links md format text>
  - code: NFO_END_DATE
    description: End date of NFO, applicable only for NFOs
    reference: <PR/Issue/Discussion Links md format text>
  - code: NFO_ALLOTMENT_DATE
    description: Allotment date of NFO, applicable only for NFOs
    reference: <PR/Issue/Discussion Links md format text>
  - code: NFO_REOPEN_DATE
    description: Reopen date of NFO, applicable only for NFOs
    reference: <PR/Issue/Discussion Links md format text>
  - code: ENTRY_LOAD
    description: Entry load for the scheme
    reference: <PR/Issue/Discussion Links md format text>
  - code: EXIT_LOAD
    description: Exit load for the scheme
    reference: <PR/Issue/Discussion Links md format text>
  - code: OFFER_DOCUMENTS
    description: Scheme related documents. Typically include SID, KIM, SAI and related addendums
    reference: <PR/Issue/Discussion Links md format text>
  - code: INVESTOR_ALLOW_LIST
    description: Allowed investor types (e.g., MINOR). Comma separated
    reference: <PR/Issue/Discussion Links md format text>
  - code: INVESTOR_BLACK_LIST
    description: Restricted investor types (e.g., NRI_US, NRI_CA). Comma separated
    reference: <PR/Issue/Discussion Links md format text>

plan_info:
  - code: CONSUMER_TNC
    description: Terms and Conditions to be accepted by the Investor
    reference: <PR/Issue/Discussion Links md format text>

plan_ids:
  - code: ISIN
    description: ISIN of the scheme plan
    reference: <PR/Issue/Discussion Links md format text>
  - code: RTA_IDENTIFIER
    description: ID of the scheme plan at the RTAs
    reference: <PR/Issue/Discussion Links md format text>
  - code: AMFI_IDENTIFIER
    description: ID of the scheme plan at AMFI
    reference: <PR/Issue/Discussion Links md format text>

plan_options:
  - code: PLAN
    description: Plan type (regular/direct etc.)
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: regular
        description: Regular scheme
        reference: <PR/Issue/Discussion Links md format text>
      - code: direct
        description: Direct scheme
        reference: <PR/Issue/Discussion Links md format text>
      - code: retail
        description: Retail scheme
        reference: <PR/Issue/Discussion Links md format text>
      - code: institutional
        description: Institutional scheme
        reference: <PR/Issue/Discussion Links md format text>
  - code: OPTION
    description: Plan option (growth/idcw etc.)
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: growth
        description: Growth option
        reference: <PR/Issue/Discussion Links md format text>
      - code: idcw
        description: IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: daily_idcw
        description: Daily IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: weekly_idcw
        description: Weekly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: monthly_idcw
        description: Monthly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: fortnightly_idcw
        description: Fortnightly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: quarterly_idcw
        description: Quarterly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: half_yearly_idcw
        description: Half Yearly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
      - code: annual_idcw
        description: Yearly IDCW option
        reference: <PR/Issue/Discussion Links md format text>
  - code: IDCW_OPTION
    description: IDCW option (reinvestment/payout)
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: payout
        description: IDCW Payout option
        reference: <PR/Issue/Discussion Links md format text>
      - code: reinvestment
        description: IDCW Reinvestment option
        reference: <PR/Issue/Discussion Links md format text>
checklists:
  - code: APPLICATION_FORM
    description: Application form requirement
    reference: <PR/Issue/Discussion Links md format text>
  - code: APPLICATION_FORM_WITH_KYC
    description: Application form with KYC requirement
    reference: <PR/Issue/Discussion Links md format text>
  - code: KYC
    description: KYC verification requirement
    reference: <PR/Issue/Discussion Links md format text>
  - code: ESIGN
    description: E-signature requirement
    reference: <PR/Issue/Discussion Links md format text>    

thresholds:
  - code: AMOUNT_MIN
    description: Minimum investment amount
    reference: <PR/Issue/Discussion Links md format text>
  - code: AMOUNT_MAX
    description: Maximum investment amount
    reference: <PR/Issue/Discussion Links md format text>
  - code: AMOUNT_MULTIPLES
    description: Investment amount multiples
    reference: <PR/Issue/Discussion Links md format text>
  - code: UNITS_MIN
    description: Minimum units
    reference: <PR/Issue/Discussion Links md format text>
  - code: UNITS_MAX
    description: Maximum units
    reference: <PR/Issue/Discussion Links md format text>
  - code: UNITS_MULTIPLES
    description: Unit multiples allowed
    reference: <PR/Issue/Discussion Links md format text>
  - code: INSTALMENTS_COUNT_MIN
    description: Minimum instalments for recurring orders
    reference: <PR/Issue/Discussion Links md format text>
  - code: INSTALMENTS_COUNT_MAX
    description: Maximum instalments for recurring orders
    reference: <PR/Issue/Discussion Links md format text>
  - code: CUMULATIVE_AMOUNT_MIN
    description: Minimum cumulative amount for recurring orders
    reference: <PR/Issue/Discussion Links md format text>
  - code: FREQUENCY
    description: SIP frequency (ISO8601 format)
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: P1M
        description: Monthly
        reference: <PR/Issue/Discussion Links md format text>
      - code: P1D
        description: Daily
        reference: <PR/Issue/Discussion Links md format text>
      - code: P1W
        description: Weekly
        reference: <PR/Issue/Discussion Links md format text>
      - code: P0.25M
        description: Four times a month
        reference: <PR/Issue/Discussion Links md format text>
      - code: P2W
        description: Fortnightly
        reference: <PR/Issue/Discussion Links md format text>
      - code: P0.5M
        description: Twice a month
        reference: <PR/Issue/Discussion Links md format text>
      - code: P3M
        description: Quarterly
        reference: <PR/Issue/Discussion Links md format text>
      - code: P6M
        description: Half yearly
        reference: <PR/Issue/Discussion Links md format text>
      - code: P1Y
        description: Yearly
        reference: <PR/Issue/Discussion Links md format text>
  - code: FREQUENCY_DAY_TYPE
    description: Type of days (applicable only for Daily SIPs)
    reference: <PR/Issue/Discussion Links md format text>
    list:
      - code: CALENDAR
        description: All calendar days are included for the Daily SIP
        reference: <PR/Issue/Discussion Links md format text>
      - code: BUSINESS
        description: Only business days are included for the Daily SIP. That means, typically Saturdays, Sundays and other market holidays are excluded.
        reference: <PR/Issue/Discussion Links md format text>
  - code: FREQUENCY_DATES
    description: Allowed dates as per the frequency for systematic orders
    reference: <PR/Issue/Discussion Links md format text>
  - code: ADDITIONAL_AMOUNT_MIN
    description: Minimum additional amount
    reference: <PR/Issue/Discussion Links md format text>
  - code: ADDITIONAL_AMOUNT_MAX
    description: Maximum additional amount
    reference: <PR/Issue/Discussion Links md format text>