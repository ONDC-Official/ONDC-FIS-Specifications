select:
  message:
    order:
      items: *a9

on_select:
  message:
    order:
      items: *a9
      provider: &a13
        tags: *providerTags
on_confirm: &order
  message:
    order:
      payments: &a15
        tags:
          - &a12
            code: BREAKUP
            description: Describes the breakup of EMIS
            reference: <PR/Issue/Discussion Links md format text>
            list: &a6
              - code: PRINCIPAL_AMOUNT
                description: Describes the loan principal, should include unit INR
                reference: <PR/Issue/Discussion Links md format text>
              - code: INTEREST_AMOUNT
                description: Describes the loan interest, should include unit INR
                reference: <PR/Issue/Discussion Links md format text> 
              - code: LATE_PAYMENT_FEE
                description: Describes the late payment fee Charges, should include unit INR
                reference: <PR/Issue/Discussion Links md format text>
              - code: LATE_FEE_AMOUNT
                description: Describes the late fee charges, should include unit INR
                reference: <PR/Issue/Discussion Links md format text>
              - code: FORECLOSURE_CHARGES
                description: Describes the foreclosure charges, should include unit INR
                reference: <PR/Issue/Discussion Links md format text>        
          - &accountDetails
            code: ACCOUNT_DETAILS
            description: Describes the breakup of EMIS
            reference: <PR/Issue/Discussion Links md format text>
            list:
              - code: BANK_NAME
                description: Describes the bank name details
                reference: <PR/Issue/Discussion Links md format text>
              - code: ACCOUNT_HOLDER_NAME
                description: Describes the account hodler details
                reference: <PR/Issue/Discussion Links md format text>
              - code: ACCOUNT_TYPE
                description: Describes the account type
                reference: <PR/Issue/Discussion Links md format text> 
      
      items: *a9
      provider: *a13
      tags:
        - *bap_terms
        - *bpp_terms
on_status: *order
on_update: *order
on_cancel: *order