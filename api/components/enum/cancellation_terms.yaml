fulfillment_state:
  descriptor:
    name:
      - code: INITIATED
        description: When a credit card application is initiated by the issuer.
        reference: <PR/Issue/Discussion Links md format text
      - code: APPROVED
        description: When a credit card application is approved by the issuer.
        reference: <PR/Issue/Discussion Links md format text
      - code: DISPATCHED
        description: When a credit card is issued and dispatched by the issuer.
        reference: <PR/Issue/Discussion Links md format text
      - code: PENDING
        description: When the credit card application is in pending state
        reference: <PR/Issue/Discussion Links md format text
      - code: REJECTED
        description: When the credit card application gets rejected by issuer due to some reason
        reference: <PR/Issue/Discussion Links md format text
      - code: COMPLETED
        description: When the overall process for credit card gets over
        reference: <PR/Issue/Discussion Links md format text
        
        