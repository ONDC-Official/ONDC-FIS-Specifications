              reference: <PR/Issue/Discussion Links md format text
            - code: LOAN_DISBURSEMENT
              description: Describes, the payment label
              reference: <PR/Issue/Discussion Links md format text  
      
      fulfillments: *a13
      cancellation_terms: &a14
        fulfillment_state:
          descriptor:
            name:
              - *a6
              - *a7
              - *a8
              - *a9
              - *a10
              - *a11
      quote: *a12
status:
  context: *a1
on_status: *a15
update: &a17
  context: *a1
  message:
    order:
      payments: *a16
      fulfillments: *a13
on_update: *a15