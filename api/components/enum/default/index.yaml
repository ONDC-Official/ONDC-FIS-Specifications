search:
  context: &a1
    location:
      country:
        code:
          - code: IND
            description: Represents the country
            reference: <PR/Issue/Discussion Links md format text>
      city:
        code:
          - code: '*'
            description: All the cities where the service is provided.
            reference: <PR/Issue/Discussion Links md format text>
          - code: std:080
            description: Represent the city code that identifies the cities. In case of '*'
              it will fetch all the cities where service is being provided.
            reference: <PR/Issue/Discussion Links md format text>
    domain:
      - code: ONDC:FIS12:PL
        description: Updated domain namespace
        reference: <PR/Issue/Discussion Links md format text>
    action:
      - code: search
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: on_search
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: select
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: on_select
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: init
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: on_init
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>        
      - code: confirm
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: on_confirm
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: status
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text> 
      - code: on_status
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: update
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>
      - code: on_update
        description: Describes the action name
        reference: <PR/Issue/Discussion Links md format text>            

  message:
    intent:
      category:
        descriptor: &categories
            code:
              - code: LOAN
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: UNSECURED_PERSONAL
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: OFFERS
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: ADDITIONAL_DATA
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: PERSONAL_FINANCING
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: TERM_LOAN
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: BUREAU_LOAN
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text
              - code: PRE_QUALIFIER
                description: Describes the categoty code
                reference: <PR/Issue/Discussion Links md format text  

                
on_search:
  context: *a1
  message:
    catalog:
      providers:
        items:
          descriptor: &a2
            code:
              - code: LOAN
                description: Describes item descriptor code
                reference: <PR/Issue/Discussion Links md format text
              - code: PRE_QUALIFIER
                description: Describes item descriptor code
                reference: <PR/Issue/Discussion Links md format text  

                
          xinput:
            form_response: &a3
              status:
                - code: PENDING
                  description: Describes the current state of the request.
                  reference: <PR/Issue/Discussion Links md format text
                - code: APPROVED
                  description: Describes the current state of the request.
                  reference: <PR/Issue/Discussion Links md format text
                - code: REJECTED
                  description: Describes the current state of the request.
                  reference: <PR/Issue/Discussion Links md format text
                - code: EXPIRED
                  description: Describes the current state of the request.
                  reference: <PR/Issue/Discussion Links md format text
                - code: SUCCESS
                  description: When form gets submitted successfully
                  reference: <PR/Issue/Discussion Links md format text
                - code: OFFLINE_PENDING
                  description: Describes the form status
                  reference: <PR/Issue/Discussion Links md format text  

                  
            head:
              descriptor:
                code:
                  - code: PERSONAL_INFORMATION
                    description: Describes the form heading
                    reference: <PR/Issue/Discussion Links md format text
                  - code: SINGLE_REDIRECTION
                    description: Link to the lender's own journey (mime_type application/html), sent with the offer in on_select
                    reference: <PR/Issue/Discussion Links md format text
                  - code: JOURNEY_OFFLINE
                    description: Link to the lender's offline journey (mime_type application/html), sent with the offer in on_select
                    reference: <PR/Issue/Discussion Links md format text
                  - code: KYC
                    description: Describes the form heading
                    reference: <PR/Issue/Discussion Links md format text    
                  - code: KYC_OFFLINE
                    description: Describes the form heading
                    reference: <PR/Issue/Discussion Links md format text  
                  - code: EMANDATE
                    description: Describes the form heading
                    reference: <PR/Issue/Discussion Links md format text
                  - code: LOAN_AGREEMENT
                    description: Describes the form heading
                    reference: <PR/Issue/Discussion Links md format text
                  
        categories:
          descriptor: *categories
        fulfillments: &a13
          state:
            descriptor:
              code:
                - &a6
                  code: INITIATED
                  description: When loan gets initiated by lender
                  reference: <PR/Issue/Discussion Links md format text
                - &a7
                  code: SANCTIONED
                  description: Loan sanction is the approval of the loan by lender
                  reference: <PR/Issue/Discussion Links md format text
                - &a8
                  code: DISBURSED
                  description: When the lender delivers the amount to the borrower after
                    verification and approval
                  reference: <PR/Issue/Discussion Links md format text
                - &a9
                  code: PENDING
                  description: When the loan is in pending state
                  reference: <PR/Issue/Discussion Links md format text
                - &a10
                  code: REJECTED
                  description: The lender is not willing to proceed with the lead based on the pre-qualification criteria.
                  reference: <PR/Issue/Discussion Links md format text
                - &a11
                  code: COMPLETED
                  description: When the overall process for loan gets over
                  reference: <PR/Issue/Discussion Links md format text
                # - code: PLACED
                #   description: Describes the base-order's fulfillment state.
                #   reference: <PR/Issue/Discussion Links md format text
                # - code: DELIVERED
                #   description: Describes the base-order's fulfillment state.
                #   reference: <PR/Issue/Discussion Links md format text
                # - code: VOID
                #   description: Describes base-order's fulfillment state.
                #   reference: <PR/Issue/Discussion Links md format text
                # - code: RETURNED
                #   description: Describes base-order's fulfillment state.
                #   reference: <PR/Issue/Discussion Links md format text
                # - code: REFUNDED
                #   description: Describes base-order's fulfillment state.
                #   reference: <PR/Issue/Discussion Links md format text
                - code: ACCEPTED
                  description: The lender has evaluated the preliminary information and is willing to accept the lead for further processing.
                  reference: <PR/Issue/Discussion Links md format text 
          type:
            - code: ONLINE
              description: Describes the fulfillments type for loan item.
              reference: <PR/Issue/Discussion Links md format text
            - code: SEMI_ONLINE
              description: Describes the fulfillments type for loan item.
              reference: <PR/Issue/Discussion Links md format text
            - code: DEDUPE
              description: Describes the fulfillments type for item.
              reference: <PR/Issue/Discussion Links md format text  
          # Loan journey steps. See docs/loan-application-statuses.md. A lender can skip a step
          # it does not run; new step types, statuses or methods need ONDC approval.
          stops:
            type:
              - code: PERSONAL_INFORMATION
                description: Personal details step (personal details form in on_search and select)
                reference: <PR/Issue/Discussion Links md format text
              - code: LOAN_OFFER
                description: Loan offer step. IN_PROGRESS when the offer is shown in on_select, COMPLETED when the borrower accepts it
                reference: <PR/Issue/Discussion Links md format text
              - code: SINGLE_REDIRECTION
                description: The borrower is on the lender's own journey (single redirection)
                reference: <PR/Issue/Discussion Links md format text
              - code: JOURNEY_OFFLINE
                description: The borrower is on the lender's journey with an offline step (offline journey)
                reference: <PR/Issue/Discussion Links md format text
              - code: KYC
                description: KYC of the borrower
                reference: <PR/Issue/Discussion Links md format text
              - code: BANK_ACCOUNT_VERIFICATION
                description: Verification of the borrower's bank account (comes before REPAYMENT)
                reference: <PR/Issue/Discussion Links md format text
              - code: REPAYMENT
                description: Repayment set-up
                reference: <PR/Issue/Discussion Links md format text
              - code: LOAN_AGREEMENT
                description: Signing of the loan agreement
                reference: <PR/Issue/Discussion Links md format text
            instructions:
              code:
                - code: PENDING
                  description: The step has not started
                  reference: <PR/Issue/Discussion Links md format text
                - code: IN_PROGRESS
                  description: The step has started and is not finished
                  reference: <PR/Issue/Discussion Links md format text
                - code: COMPLETED
                  description: The step is finished
                  reference: <PR/Issue/Discussion Links md format text
                - code: FAILED
                  description: The step failed; the fulfillment state is REJECTED and error.code carries the reason
                  reference: <PR/Issue/Discussion Links md format text
              # The method the lender used for KYC, BANK_ACCOUNT_VERIFICATION, REPAYMENT and LOAN_AGREEMENT.
              # Steps without a method (PERSONAL_INFORMATION, LOAN_OFFER, SINGLE_REDIRECTION, JOURNEY_OFFLINE)
              # carry their display name, listed first.
              name:
                - code: Personal Information
                  description: Display name of the PERSONAL_INFORMATION step (no method)
                  reference: <PR/Issue/Discussion Links md format text
                - code: Loan Offer
                  description: Display name of the LOAN_OFFER step (no method)
                  reference: <PR/Issue/Discussion Links md format text
                - code: Single Redirection
                  description: Display name of the SINGLE_REDIRECTION step (no method)
                  reference: <PR/Issue/Discussion Links md format text
                - code: Journey Offline
                  description: Display name of the JOURNEY_OFFLINE step (no method)
                  reference: <PR/Issue/Discussion Links md format text
                - code: OFFLINE
                  description: KYC method - offline KYC
                  reference: <PR/Issue/Discussion Links md format text
                - code: AADHAR
                  description: KYC method - Aadhaar KYC
                  reference: <PR/Issue/Discussion Links md format text
                - code: VKYC
                  description: KYC method - video KYC
                  reference: <PR/Issue/Discussion Links md format text
                - code: LIVENESS
                  description: KYC method - liveness check
                  reference: <PR/Issue/Discussion Links md format text
                - code: PENNY DROP
                  description: Bank account verification method - penny drop
                  reference: <PR/Issue/Discussion Links md format text
                - code: PENNYLESS
                  description: Bank account verification method - pennyless
                  reference: <PR/Issue/Discussion Links md format text
                - code: SI
                  description: Repayment method - standing instruction
                  reference: <PR/Issue/Discussion Links md format text
                - code: E-MANDATE
                  description: Repayment method - e-mandate
                  reference: <PR/Issue/Discussion Links md format text
                - code: CLICKWRAP
                  description: Loan agreement method - clickwrap
                  reference: <PR/Issue/Discussion Links md format text
                - code: AADHAR ESIGN
                  description: Loan agreement method - Aadhaar eSign
                  reference: <PR/Issue/Discussion Links md format text

                
            # - code: BASE_ORDER
            #   description: Describes the fulfillments type for order item
            #   reference: <PR/Issue/Discussion Links md format text.
        
           
select:
  context: *a1
  message:
    order:
      items:
        descriptor: *a2
        xinput:
          form_response: *a3
          head:
            descriptor:
              code: &a4 []
              
on_select:
  context: *a1
  message:
    order:
      items:
        descriptor: *a2
        xinput:
          form_response: *a3
          head:
            descriptor:
              code: *a4
      quote: &a12
        breakup:
          title:
            - code: PROCESSING_FEE
              description: Describes the amount which is charged by the lender, should include
                unit INR
              reference: <PR/Issue/Discussion Links md format text>
            - code: INSURANCE_CHARGES
              description: Describes the insurance charges which is charged by the lender,
                should include unit INR.
              reference: <PR/Issue/Discussion Links md format text>
            - code: OTHER_UPFRONT_CHARGES
              description: Describes the other upfront charges which is charged by the lender,
                should include unit INR
              reference: <PR/Issue/Discussion Links md format text>
            - code: OTHER_CHARGES
              description: Describes the other charges which is charged by the lender, should
                include unit INR.
              reference: <PR/Issue/Discussion Links md format text>
            - code: LATE_FEE_AMOUNT
              description: Describes the late fee charges, in case of emi delays, should
                include unit INR.
              reference: <PR/Issue/Discussion Links md format text>
            - code: FORECLOSURE_CHARGES
              description: Describes the charges associated with early loan repayment, should
                include unit INR or %.
              reference: <PR/Issue/Discussion Links md format text>
            - code: PRE_PAYMENT_CHARGE
              description: Describes the amount charged by lender for pre payement, should
                include unit INR
              reference: <PR/Issue/Discussion Links md format text>
            - code: PRINCIPAL_AMOUNT
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text> 
            - code: INTEREST_AMOUNT
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text>
            - code: NET_DISBURSED_AMOUNT
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text>
            - code: OUTSTANDING_INTEREST
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text>
            - code: PRE_PAYMENT_CHARGE
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text>
            - code: LATE_FEE_AMOUNT
              description: Describes the quote title
              reference: <PR/Issue/Discussion Links md format text>    
      fulfillments: *a13
                      
init:
  context: *a1
  message:
    order:
      items: &a5
        descriptor: *a2
        xinput:
          form_response: *a3
          head:
            descriptor:
              code:
                - code: ACCOUNT_INFORMATION
                  description: Borrowers bank account details
                  reference: <PR/Issue/Discussion Links md format text
      payments: &a16
        type:
          - code: ON-ORDER
            description: Payment happens on order placement
            reference: <PR/Issue/Discussion Links md format text
          - code: ON_FULFILLMENT
            description: Payment happens on completion of the service
            reference: <PR/Issue/Discussion Links md format text
          - code: POST_FULFILLMENT
            description: Payment happens post completion of the service
            reference: <PR/Issue/Discussion Links md format text
        collected_by:
          - code: BPP
            description: When seller app is collecting the payment
            reference: <PR/Issue/Discussion Links md format text
          - code: BAP
            description: When buyer app is collecting the payment
            reference: <PR/Issue/Discussion Links md format text
          - code: CONSUMER
            description: When the borrower receives the payment (loan disbursal)
            reference: <PR/Issue/Discussion Links md format text
        status:
          - code: PAID
            description: Reflects current status wheteher installment has been paid or not
            reference: <PR/Issue/Discussion Links md format text
          - code: NOT-PAID
            description: Reflects current status wheteher installment has been paid or not
            reference: <PR/Issue/Discussion Links md format text
          - code: DEFERRED
            description: Reflects current payment status when the installment is deferred.
            reference: <PR/Issue/Discussion Links md format text
          - code: DELAYED
            description: Reflects current payment status when the installment is delayed.
            reference: <PR/Issue/Discussion Links md format text
        time:
          label:
            - code: MISSED_EMI_PAYMENT
              description: Describes, when buyer missed to make a scheduled installment
                payment.
              reference: <PR/Issue/Discussion Links md format text
            - code: FORECLOSURE
              description: Describes, when buyer initates the foreclose intent.
              reference: <PR/Issue/Discussion Links md format text
            - code: PRE_PART_PAYMENT
              description: Describes, when buyer initates the pre part intent.
              reference: <PR/Issue/Discussion Links md format text
            - code: INSTALLMENT
              description: Describes, an amount that a borrower makes over a period of time in
                order to pay off a loan.
              reference: <PR/Issue/Discussion Links md format text
            - code: LOAN_DISBURSMENT
              description: Describes, the payment label
              reference: <PR/Issue/Discussion Links md format text  
      
on_init:
  context: *a1
  message:
    order:
      items: *a5
      fulfillments: *a13
        
      cancellation_terms: &a14
        fulfillment_state:
          descriptor:
            name:
              - *a6
              - *a7
              - *a8
              - *a9
              - *a10
              - *a11
      quote: *a12
      payments: *a16
confirm:
  context: *a1
  message:
    order:
      items:
        descriptor: *a2
        xinput:
          form_response: *a3
      payments: *a16    
on_confirm: &a15
  context: *a1
  message:
    order:
      items:
        descriptor: *a2
        xinput:
          form_response: *a3
          head:
            descriptor:
              code:
                - code: EMANDATE
                  description: Describes form heading.
                  reference: <PR/Issue/Discussion Links md format text
                - code: PERSONAL_INFORMATION
                  description: Describes form heading.
                  reference: <PR/Issue/Discussion Links md format text
                - code: SINGLE_REDIRECTION
                  description: Link to the lender's own journey (mime_type application/html), sent with the offer in on_select
                  reference: <PR/Issue/Discussion Links md format text
                - code: JOURNEY_OFFLINE
                  description: Link to the lender's offline journey (mime_type application/html), sent with the offer in on_select
                  reference: <PR/Issue/Discussion Links md format text
                - code: KYC
                  description: Describes form heading.
                  reference: <PR/Issue/Discussion Links md format text
      payments: *a16
      fulfillments: *a13
      cancellation_terms: *a14
      quote: *a12
status:
  context: *a1
on_status: *a15
update: &a17
  context: *a1
  message:
    order:
      payments: *a16
      fulfillments: *a13
on_update: *a15