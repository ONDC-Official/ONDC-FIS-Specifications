state: 
  descriptor:
    code:
      - code: INITIATED
        description: When loan gets initiated by issuer
        reference: <PR/Issue/Discussion Links md format text
      - code: DISPATCHED
        description: Credit card dispatched by the issuer.
        reference: <PR/Issue/Discussion Links md format text
      - code: APPROVED
        description: When a credit card application is initiated by the issuer.
        reference: <PR/Issue/Discussion Links md format text
      - code: PENDING
        description: When the credit card application is in pending state
        reference: <PR/Issue/Discussion Links md format text
      - code: REJECTED
        description: When the credit card request gets rejected by issuer due to some reason
        reference: <PR/Issue/Discussion Links md format text
      - code: COMPLETED
        description: When the overall process for credit card over
        reference: <PR/Issue/Discussion Links md format text
