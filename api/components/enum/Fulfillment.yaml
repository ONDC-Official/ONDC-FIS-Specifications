    - code: LOAN_OFFER
      description: Describes the stops type as LOAN_OFFER
      reference: <PR/Issue/Discussion Links md format text
    - code: SINGLE_REDIRECTION
      description: Describes the stops type as SINGLE_REDIRECTION
      reference: <PR/Issue/Discussion Links md format text
    - code: JOURNEY_OFFLINE
      description: Describes the stops type as JOURNEY_OFFLINE
      reference: <PR/Issue/Discussion Links md format text      
    - code: KYC
      description: Describes the stops type as KYC
      reference: <PR/Issue/Discussion Links md format text
    - code: REPAYMENT
      description: Describes the stops type as PERSONAL_INFORMATION
      reference: <PR/Issue/Discussion Links md format text
    - code: BANK_ACCOUNT_VERIFICATION
      description: Describes the stops type as PERSONAL_INFORMATION
      reference: <PR/Issue/Discussion Links md format text
    - code: LOAN_AGREEMENT
      description: Describes the stops type as PERSONAL_INFORMATION
      reference: <PR/Issue/Discussion Links md format text        
  instructions:
    code:
      - code: PENDING
        description: The process is pending and yet to be initiated.
        reference: <PR/Issue/Discussion Links md format text
      - code: IN_PROGRESS
        description: The process is currently in progress.
        reference: <PR/Issue/Discussion Links md format text
      - code: SELECTED
        description: The loan offer has been selected by the user.
        reference: <PR/Issue/Discussion Links md format text
      - code: FINALIZED
        description: The loan offer has been finalized.
        reference: <PR/Issue/Discussion Links md format text
      - code: INITIATED
        description: The process has been initiated.
        reference: <PR/Issue/Discussion Links md format text
      - code: FAILED
        description: The process has failed and may require retry or user intervention.
        reference: <PR/Issue/Discussion Links md format text
      - code: SUCCESSFUL
        description: The process has been completed successfully.
        reference: <PR/Issue/Discussion Links md format text             


    
