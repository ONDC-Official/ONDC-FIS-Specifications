search:
  context:
    location:
      country:
        code:
          required: mandatory
          type: string
          owner: BAP
          usage: IND
          description: Describes country code as per ISO 3166-1 and ISO 3166-2 format
        _description:
          required: Mandatory
          type: object
          owner: BAP
          usage: '--'
          description: >-
            This attribute defines the country of location where the transaction
            is meant to be completed.
      city:
        code:
          required: mandatory
          type: string
          owner: BAP
          usage: '*'
          description: Describes the city code this location is, or is located within
        _description:
          required: Mandatory
          type: object
          owner: BAP
          usage: '--'
          description: >-
            This attribute defines the city of location where the transaction is
            meant to be completed.
      _description:
        required: Mandatory
        type: object
        owner: BAP
        usage: '--'
        description: >-
          This attribute defines the location where the transaction is meant to
          be completed.
    domain:
      required: mandatory
      type: string
      owner: BAP
      usage: ONDC:FIS13
      description: Describes domain code that is relevant to this transaction context
    timestamp:
      required: mandatory
      type: string
      owner: BAP
      usage: '2023-03-23T04:41:16Z'
      description: Describes tme of request generation in RFC3339 format
    bap_id:
      required: mandatory
      type: string
      owner: BAP
      usage: fis.test.bap.io
      description: Describes subscriber ID of the BAP
    transaction_id:
      required: mandatory
      type: string
      owner: BAP
      usage: 6743e9e2
      description: Describes  a unique value which persists across all API calls
    message_id:
      required: mandatory
      type: string
      owner: BAP
      usage: 13ba8018f176
      description: >-
        Describes a unique value which persists during a request / callback
        cycle.
    version:
      required: mandatory
      type: integer
      owner: BAP
      usage: 2.0.0
      description: Describes the version of transaction protocol being used by the sender.
    action:
      required: mandatory
      type: string
      owner: BAP
      usage: search
      description: >-
        Describes the Beckn protocol method being called by the sender and
        executed at the receiver.
    bap_uri:
      required: mandatory
      type: string
      owner: BAP
      usage: https://fis.test.bap.io/
      description: Describes subscriber URL of the BAP for accepting callbacks from BPPs.
    ttl:
      required: mandatory
      type: string
      owner: BAP
      usage: PT30S
      description: >-
        Describes the duration in ISO8601 format after timestamp for which this
        message holds valid
    bpp_id:
      required: optional
      type: string
      owner: BPP
      usage: fis.test.bpp.io
      description: Describes subscriber ID of the BPP
    bpp_uri:
      required: optional
      type: string
      owner: BPP
      usage: https://fis.test.bpp.io/
      description: Describes subscriber URL of the BPP for accepting calls from BAPs.
  message:
    intent:
      category:
        descriptor:
          code:
            required: optional
            type: string
            owner: BAP
            usage: MICRO_HOSPICASH_INSURANCE
            description: Describes the type of insurance.
          _description:
            required: Mandatory
            type: object
            owner: BAP
            usage: '--'
            description: >-
              It refers to providing additional details about the
              characteristics, features and attributes of products.
        _description:
          required: Mandatory
          type: object
          owner: BAP
          usage: '--'
          description: >-
            This attribute explains what personal loan or invoice based loans
            are and how they function. It can provide the details into the
            nature of choosen loan
      fulfillment:
        agent:
          person:
            id:
              required: optional
              type: string
              owner: BAP
              usage: 0120TRVK
              description: Describes the agent id
      provider:
        id:
          required: optional
          type: string
          owner: BPP
          usage: 1121TRVZ
          description: Describes unique id of provider
        items:
          id:
            required: optional
            type: string
            owner: BPP
            usage: XV21TRVV
            description: Describes unique id of item
          _description:
            required: optional
            type: object
            owner: BAP/BPP
            usage: '--'
            description: >-
              The provider from which the customer wants to place to the order
              from
          tags:
            BAP_INPUTS:
              required: optional
              type: string
              owner: BPP
              usage: '--'
              description: Describes the bap inputs tag group
              list:
                BUYER_NAME:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer name
                BUYER_PHONE_NUMBER:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer phone number
                BUYER_PAN_NUMBER:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer pan number
                BUYER_DOB:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer dob
                BUYER_GENDER:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer gender
                SUM_INSURED:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the sum insured
                BUYER_EMAIL:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the buyer email
                TENURE:
                  required: optional
                  type: string
                  owner: BPP
                  usage: '--'
                  description: Describes the tenure
        _description:
          required: optional
          type: object
          owner: BAP/BPP
          usage: '--'
          description: >-
            The provider from which the customer wants to place to the order
            from
        tags:
          MASTER_POLICY:
            required: optional
            type: string
            owner: BPP
            usage: '--'
            description: Describes the master policy
            list:
              POLICY_ID:
                required: optional
                type: string
                owner: BPP
                usage: '--'
                description: Describes the policy id
      payment:
        collected_by:
          required: optional
          type: string
          owner: BAP
          usage: BPP
          description: 'This field indicates who is the collector of payment. '
        _description:
          required: optional
          type: object
          owner: BAP
          usage: '--'
          description: >-
            The terms of settlement for this order. It describes that how the
            customer wants to pay for the order.
      _description:
        required: Mandatory
        type: object
        owner: BAP
        usage: '--'
        description: Describe the intent to buy or avail a product or a service.
      tags:
        BAP_TERMS:
          required: Mandatory
          type: string
          owner: BAP
          usage: '--'
          description: Describes the bap terms
          list:
            STATIC_TERMS:
              required: Mandatory
              type: string
              owner: BAP
              usage: '--'
              description: Describes the static terms
            OFFLINE_CONTRACT:
              required: Mandatory
              type: string
              owner: BAP
              usage: '--'
              description: Describes the offline contract
