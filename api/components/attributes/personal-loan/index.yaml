# Personal Loan (ONDC:FIS12:PL, version 2.3.0) field rules for the Tunnel validator and Workbench.
# For every call: which fields are MANDATORY or OPTIONAL (an OPTIONAL field that is mandatory in some calls says so in its description), who fills them (owner), the allowed values or an example
# (usage) and a description. Built from the final PL examples; review with the Schema Validation Pod and Workbench.
search:
  context:
    domain:
      required: MANDATORY
      type: string
      owner: BAP
      usage: ONDC:FIS12:PL
      description: Domain of the transaction. Personal Loan calls use ONDC:FIS12:PL; plain ONDC:FIS12 is not accepted.
    location:
      country:
        code:
          required: MANDATORY
          type: string
          owner: BAP
          usage: IND
          description: Country code as per ISO 3166-1 and ISO 3166-2 format
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: The country this location is, or is located within
      city:
        code:
          required: MANDATORY
          type: string
          owner: BAP
          usage: std:080
          description: City code
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: The city this location is, or is located within
      _description:
        required: MANDATORY
        type: object
        owner: BAP
        usage: '--'
        description: The location where the transaction is intended to be fulfilled.
    action:
      required: MANDATORY
      type: string
      owner: BAP
      usage: search | on_search | select | on_select | on_confirm | status | on_status | update | on_update
      description: Describes action.
    version:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 2.3.0
      description: Version of the Personal Loan spec. Always 2.3.0.
    bap_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: bap.credit.becknprotocol.io
      description: Subscriber ID of the BAP
    bap_uri:
      required: MANDATORY
      type: string
      owner: BAP
      usage: https://bap.credit.becknprotocol.io/
      description: Subscriber URL of the BAP for accepting callbacks from BPPs.
    transaction_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 4179de3c-7088-4732-9786-e1fdba540b56
      description: Id of the PL transaction, the same in every call from search to the last servicing call.
    message_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 48306890-40b1-53e9-8760-a4931911532a
      description: >-
        Unique id of the request. A solicited callback echoes the message_id of its request; an unsolicited on_status / on_confirm /
        on_update has its own message_id.
    timestamp:
      required: MANDATORY
      type: string
      owner: BAP
      usage: '2026-11-17T05:23:03.443Z'
      description: Time of request generation in RFC3339 format
    ttl:
      required: MANDATORY
      type: string
      owner: BAP
      usage: PT10M
      description: The duration in ISO8601 format after timestamp for which this message holds valid
    _description:
      required: MANDATORY
      type: object
      owner: BAP
      usage: '--'
      description: Describes context.
  message:
    intent:
      category:
        descriptor:
          code:
            required: MANDATORY
            type: string
            owner: BAP
            usage: LOAN | UNSECURED_PERSONAL | OFFERS | ADDITIONAL_DATA | PERSONAL_FINANCING | TERM_LOAN | BUREAU_LOAN | PRE_QUALIFIER
            description: Describes code.
          _description:
            required: MANDATORY
            type: object
            owner: BAP
            usage: '--'
            description: Physical description of something.
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: Details on the item category
      payment:
        collected_by:
          required: MANDATORY
          type: string
          owner: BAP
          usage: BPP
          description: >-
            This field indicates who is the collector of payment. The BAP can set this value to 'bap' if it wants to collect the payment
            first and settle it to the BPP. If the BPP agrees to those terms, the BPP should not send the payment url. Alternatively, the
            BPP can set this field with the value 'bpp' if it wants the payment to be made directly.
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: Details on how the customer wants to pay for the order
      tags:
        BAP_TERMS:
          required: MANDATORY
          type: string
          owner: BAP
          usage: '--'
          description: Describes the finder fees of the loan for buyer
          list:
            STATIC_TERMS:
              required: MANDATORY
              type: string
              owner: BAP
              usage: https://bap.credit.becknprotocol.io/personal-banking/loans/personal-loan
              description: Describes the static terms
            OFFLINE_CONTRACT:
              required: MANDATORY
              type: string
              owner: BAP
              usage: 'true'
              description: Describes the offline contract.
      _description:
        required: MANDATORY
        type: object
        owner: BAP
        usage: '--'
        description: >-
          The intent to buy or avail a product or a service. The BAP can declare the intent of the consumer containing <ul><li>What they
          want (A product, service, offer)</li><li>Who they want (A seller, service provider, agent etc)</li><li>Where they want it and
          where they want it from</li><li>When they want it (start and end time of fulfillment</li><li>How they want to pay for
          it</li></ul><br>This has properties like descriptor,provider,fulfillment,payment,category,offer,item,tags<br>This is typically
          used by the BAP to send the purpose of the user's search to the BPP. This will be used by the BPP to find products or services it
          offers that may match the user's intent.<br>For example, in Mobility, the mobility consumer declares a mobility intent. In this
          case, the mobility consumer declares information that describes various aspects of their journey like,<ul><li>Where would they
          like to begin their journey (intent.fulfillment.start.location)</li><li>Where would they like to end their journey
          (intent.fulfillment.end.location)</li><li>When would they like to begin their journey (intent.fulfillment.start.time)</li><li>When
          would they like to end their journey (intent.fulfillment.end.time)</li><li>Who is the transport service provider they would like
          to avail services from (intent.provider)</li><li>Who is traveling (This is not recommended in public networks)
          (intent.fulfillment.customer)</li><li>What kind of fare product would they like to purchase (intent.item)</li><li>What add-on
          services would they like to avail</li><li>What offers would they like to apply on their booking (intent.offer)</li><li>What
          category of services would they like to avail (intent.category)</li><li>What additional luggage are they carrying</li><li>How
          would they like to pay for their journey (intent.payment)</li></ul><br>For example, in health domain, a consumer declares the
          intent for a lab booking the describes various aspects of their booking like,<ul><li>Where would they like to get their scan/test
          done (intent.fulfillment.start.location)</li><li>When would they like to get their scan/test done
          (intent.fulfillment.start.time)</li><li>When would they like to get the results of their test/scan
          (intent.fulfillment.end.time)</li><li>Who is the service provider they would like to avail services from
          (intent.provider)</li><li>Who is getting the test/scan (intent.fulfillment.customer)</li><li>What kind of test/scan would they
          like to purchase (intent.item)</li><li>What category of services would they like to avail (intent.category)</li><li>How would they
          like to pay for their journey (intent.payment)</li></ul>
    _description:
      required: MANDATORY
      type: object
      owner: BAP
      usage: '--'
      description: Describes message.
