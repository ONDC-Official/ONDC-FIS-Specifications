    ttl:
      required: MANDATORY
      type: string
      owner: BPP
      usage: PT30M
      description: The duration in ISO8601 format after timestamp for which this message holds valid
    _description:
      required: MANDATORY
      type: object
      owner: BPP
      usage: '--'
