# Personal Loan (ONDC:FIS12:PL, version 2.3.0) field rules for the Tunnel validator and Workbench.
# For every call: whether each field is MANDATORY or OPTIONAL, who fills it (owner), the allowed values
# or an example (usage) and a description. OPTIONAL means the field is not sent in every case of the
# call; where a case needs it (dedupe, offer request, no-offer reply, failed step), the description says so.
# Personal details fields follow docs/common-forms-fields.md; journey steps follow
# docs/loan-application-statuses.md. Tags are listed by descriptor code.
# Built from the examples of the enabled PL flows.
search:
  context:
    domain:
      required: MANDATORY
      type: string
      owner: BAP
      usage: ONDC:FIS12:PL
      description: Domain of the transaction. Personal Loan calls use ONDC:FIS12:PL; plain ONDC:FIS12 is not accepted.
    action:
      required: MANDATORY
      type: string
      owner: BAP
      usage: search
      description: The Beckn protocol method being called by the sender and executed at the receiver.
    timestamp:
      required: MANDATORY
      type: string
      owner: BAP
      usage: '2026-06-05T09:08:26.049Z'
      description: Time of request generation in RFC3339 format
    transaction_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 4179de3c-7088-4732-9786-e1fdba540b56
      description: Id of the PL transaction, the same in every call from search to the last servicing call.
    message_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 519ea1f3-bf56-4397-804c-23740cffb75f
      description: Unique id of the request. A solicited callback echoes the message_id of its request; an unsolicited on_status / on_confirm / on_update has its own message_id.
    bap_id:
      required: MANDATORY
      type: string
      owner: BAP
      usage: bap.example.com
      description: Subscriber ID of the BAP
    bap_uri:
      required: MANDATORY
      type: string
      owner: BAP
      usage: https://bap.example.com
      description: Subscriber URL of the BAP for accepting callbacks from BPPs.
    ttl:
      required: MANDATORY
      type: string
      owner: BAP
      usage: PT30S
      description: The duration in ISO8601 format after timestamp for which this message holds valid
    version:
      required: MANDATORY
      type: string
      owner: BAP
      usage: 2.3.0
      description: Version of the Personal Loan spec. Always 2.3.0.
    location:
      country:
        code:
          required: MANDATORY
          type: string
          owner: BAP
          usage: IND
          description: Country code as per ISO 3166-1 and ISO 3166-2 format
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: The country this location is, or is located within
      city:
        code:
          required: MANDATORY
          type: string
          owner: BAP
          usage: '*'
          description: City code
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: The city this location is, or is located within
      _description:
        required: MANDATORY
        type: object
        owner: BAP
        usage: '--'
        description: The location where the transaction is intended to be fulfilled.
    _description:
      required: MANDATORY
      type: object
      owner: BAP
      usage: '--'
      description: Every API call in beckn protocol has a context.
  message:
    intent:
      category:
        descriptor:
          code:
            required: MANDATORY
            type: string
            owner: BAP
            usage: LOAN
            description: Code from the PL enum or tag list.
          _description:
            required: MANDATORY
            type: object
            owner: BAP
            usage: '--'
            description: Physical description of something.
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: Details on the item category
      payment:
        collected_by:
          required: MANDATORY
          type: string
          owner: BAP
          usage: BPP
          description: This field indicates who is the collector of payment. The BAP can set this value to 'bap' if it wants to collect the payment first and settle it to the BPP. If the BPP agrees to those terms, the BPP should not send the payment url. Alternatively, the BPP can set this field with the value 'bpp' if it wants the payment to be made directly.
        _description:
          required: MANDATORY
          type: object
          owner: BAP
          usage: '--'
          description: Details on how the customer wants to pay for the order
      tags:
        BAP_TERMS:
          required: MANDATORY
          type: array
          owner: BAP
          usage: '--'
          description: Describes the finder fees of the loan for buyer
          list:
            STATIC_TERMS:
              required: MANDATORY
              type: string
              owner: BAP
              usage: https://bap.credit.becknprotocol.io/personal-banking/loans/personal-loan
              description: Describes the static terms
            OFFLINE_CONTRACT:
              required: MANDATORY
              type: string
              owner: BAP
              usage: 'true'
              description: Describes the offline contract.
      _description:
        required: MANDATORY
        type: object
        owner: BAP
        usage: '--'
        description: The intent to buy or avail a product or a service.
    _description:
      required: MANDATORY
      type: object
      owner: BAP
      usage: '--'
      description: Payload of the call.
on_search:
  context:
    domain:
      required: MANDATORY
